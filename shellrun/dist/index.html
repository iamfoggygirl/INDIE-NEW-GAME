:root{color-scheme:dark;--navy:#12203A;--frame:#1d3157;--frame2:#29426f;--cream:#fbf1d8;--cream2:#f3e3bf;--ink:#1b2433;--muted:#6a7186;--green:#7DB05A;--green2:#4f7d36;--teal:#6fd1c8;--teal2:#3d9e96;--gold:#E0B040;--coral:#E8664A;--red:#D93A3A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0b1428;overflow:hidden;font-family:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;margin:0 auto;height:100%;max-width:560px;overflow:hidden;background:#12203A}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov2{z-index:2}
.hud{opacity:0;transition:opacity .4s;position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;z-index:5}
.pill{background:rgba(18,32,58,.82);border:2px solid rgba(255,243,196,.18);border-radius:999px;padding:5px 12px 5px 7px;font-weight:900;font-size:18px;color:var(--cream);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill svg{width:28px;height:28px;flex:none}
.pill .sub{font-size:13px;opacity:.7}
.pill.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.18)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#app.playing .hud{opacity:1}
#lostP{opacity:0;transform:scale(.6);transition:.3s cubic-bezier(.2,1.6,.4,1);gap:1px;padding:6px 9px}
#lostP.on{opacity:1;transform:none}
#lostP .ht{display:inline-flex;width:19px;height:19px}
#lostP .ht svg{width:100%;height:100%}
#lostP .ht.brk{animation:hbrk .7s ease-out}
#lostP.last .ht:not(.gone){animation:hbeat 1.1s infinite}
@keyframes hbrk{0%{transform:scale(1.6) rotate(-12deg);filter:brightness(2)}40%{transform:scale(.7) rotate(14deg)}100%{transform:none}}
@keyframes hbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.dangerV{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 80px 8px rgba(232,102,74,.6)}
.dangerV.on{opacity:1;animation:dng 1.15s infinite}
@keyframes dng{0%,100%{opacity:.35}15%{opacity:1}45%{opacity:.6}}
.ribbon .new.tag{background:#6a4bd8}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,243,196,.18);background:rgba(18,32,58,.82);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.iconbtn svg{width:26px;height:26px}
.iconbtn:active{transform:scale(.92)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#banner{position:absolute;left:0;right:0;top:calc(108px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none;z-index:5;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s}
#banner.on{opacity:1;transform:none}
.ribbon{position:relative;background:var(--gold);color:#4a2f00;font-weight:900;font-size:21px;padding:8px 26px;border-radius:10px;box-shadow:0 4px 0 #a87b1c,0 10px 24px rgba(0,0,0,.35);text-wrap:balance;text-align:center;max-width:300px}
.ribbon.coral{background:var(--coral);color:#fff7ee;box-shadow:0 4px 0 #a8432d,0 10px 24px rgba(0,0,0,.35)}
.ribbon small{display:block;font-size:12px;letter-spacing:.12em;opacity:.75}.ribbon .place{display:block;font-size:11px;font-style:normal;font-weight:800;letter-spacing:.05em;opacity:.7;margin-top:1px}
#cap{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:23px;font-weight:900;color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;z-index:5;padding:0 16px;text-wrap:balance}
#cap.on{opacity:1;transform:none}
.veil{position:absolute;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;z-index:10;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{position:relative;margin-top:74px;background:var(--frame);border-radius:30px;padding:10px;width:100%;max-width:350px;box-shadow:0 8px 0 #0d1830,0 26px 50px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(24px);opacity:0}}
.inner{background:var(--cream);border-radius:22px;padding:44px 16px 16px;text-align:center}
.card .ribbon{position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;font-size:22px}
.stars{position:absolute;left:0;right:0;top:-104px;display:flex;justify-content:center;align-items:flex-end;gap:2px;pointer-events:none}

/* ================= STUDIO UI SYSTEM =================
   one language everywhere: thick navy outline, hard lip shadow, glossy top, outlined display type.
   tokens */
:root{--o:#16243b;--o2:#0d1726;--cr:#fdf6e2;--cr2:#f3e8cc;--cr3:#e4d4ae;--txt:#2c3e55;--sub:#5d6b85;
  --disp:"Fredoka",ui-rounded,system-ui,sans-serif;--body:"Nunito",ui-rounded,system-ui,sans-serif;--mark:"Lilita One","Fredoka",system-ui,sans-serif}
html,body{font-family:var(--body)}
.gt,button,.pill,.chip,#cap,.ribbon,.big,.node,.maptitle,.dk span{font-family:var(--disp);font-weight:700;letter-spacing:.01em;paint-order:stroke fill;-webkit-text-stroke:var(--sw,3px) var(--o);color:#fff;text-shadow:0 2px 0 var(--o)}
svg{-webkit-text-stroke:0}
.pill svg,.iconbtn svg,.chip svg,button svg,.dk i svg,.lbl svg,.stat svg{filter:drop-shadow(0 2px 0 rgba(13,23,38,.85))}

/* HUD */
.hud{transition:opacity .35s,transform .35s cubic-bezier(.4,0,.2,1)}
.pill{background:linear-gradient(#2c4673,#1b2e50);border:3px solid var(--o);box-shadow:0 4px 0 var(--o2),inset 0 2px 0 rgba(255,255,255,.2);font-size:19px;padding:4px 12px 4px 6px;--sw:3.5px}
.pill .sub{font-size:13px;opacity:1;color:#bcd0ee;--sw:3px}
.iconbtn{border:3px solid var(--o);border-radius:15px;width:46px;height:46px;background:linear-gradient(#2c4673,#1b2e50);box-shadow:0 4px 0 var(--o2),inset 0 2px 0 rgba(255,255,255,.2);min-height:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o2)}
#app.modal .hud,#app.modal #power,#app.modal #cap,#app.modal #banner{opacity:0!important;transform:translateY(-90px);pointer-events:none}
#app.modal #power,#app.modal #cap{transform:translateY(40px)}
#cap{font-size:24px;--sw:5px;text-shadow:0 3px 0 var(--o),0 0 18px rgba(0,0,0,.35)}

/* buttons: one family, three weights */
button{border:3px solid var(--o);border-radius:18px;min-height:54px;font-size:20px;padding:6px 18px 10px;position:relative;overflow:hidden;--lip:#2d6e1e;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -6px 0 var(--lip),0 4px 0 var(--o),0 8px 14px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;margin-bottom:4px;--sw:4px}
button:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -3px 0 var(--lip),0 1px 0 var(--o),0 3px 6px rgba(0,0,0,.25)}
button:disabled{filter:saturate(.35) brightness(.92);cursor:default}
.b-green{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 48%),linear-gradient(#93e06a,#56bb3b 62%,#43a02e);--lip:#2b6a1d;color:#fff}
.b-navy{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0) 48%),linear-gradient(#3a5a8e,#24406b 62%,#1d3558);--lip:#0f1b2e;color:#fff;min-height:48px;font-size:17px}
.b-teal{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 48%),linear-gradient(#63e1d5,#22aebf 62%,#1a95a8);--lip:#0d5f6d;color:#fff;font-size:17px}
.b-gold{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 48%),linear-gradient(#ffe27a,#f8b52c 62%,#ee9c12);--lip:#a36300;color:#fff}
.b-coral{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 48%),linear-gradient(#ff9c7d,#ee6447 62%,#dc4f34);--lip:#93301d;color:#fff}
.hero{min-height:62px;font-size:24px;--sw:5px}
.hero::after{content:"";position:absolute;top:-30%;bottom:-30%;width:34%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:sheen 3.6s 1.4s infinite;pointer-events:none}
@keyframes sheen{0%{left:-50%}24%,100%{left:130%}}
.btns{display:grid;gap:6px;margin-top:14px;flex-direction:initial}
.btns .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .duo button{font-size:16px;padding:6px 8px;gap:6px}
.btns .duo button svg{width:20px;height:20px}

/* panels */
.veil{background:rgba(8,20,38,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{background:linear-gradient(#2c4a79,#1b2f52);border:3px solid var(--o);border-radius:30px;padding:8px;box-shadow:0 10px 0 var(--o2),0 10px 0 3px var(--o),0 30px 60px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.22);margin-top:86px;max-width:352px;animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
.inner{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/></svg>"),var(--cr);border-radius:22px;box-shadow:0 0 0 2px var(--o),inset 0 3px 0 #fff,inset 0 -5px 0 var(--cr3);padding:40px 16px 12px;color:var(--txt)}
.lbl{font-family:var(--body);font-weight:800;color:var(--sub);font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* ribbon with folded tails */
.ribbon{background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 50%),linear-gradient(#ffe27a,#f8b52c 60%,#ef9d14);border:3px solid var(--o);border-radius:13px;box-shadow:0 5px 0 #a36300,0 5px 0 3px var(--o),inset 0 2px 0 rgba(255,255,255,.65);font-size:24px;padding:7px 26px 8px;--sw:5px;max-width:310px}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:50%;width:30px;height:38px;margin-top:-12px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'><path d='M38 4H4l10 19L4 42h34z' fill='%23e08f10' stroke='%2316243b' stroke-width='3.2' stroke-linejoin='round'/><path d='M38 4v38' stroke='%2316243b' stroke-width='3.2'/><path d='M8 8h27' stroke='%23ffd77a' stroke-width='2.4' stroke-linecap='round' opacity='.8'/></svg>") center/100% 100% no-repeat;z-index:-1}
.ribbon::before{left:-27px}.ribbon::after{right:-27px;transform:scaleX(-1)}
.ribbon.coral{background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 50%),linear-gradient(#ff9c7d,#ee6447 60%,#dc4f34);box-shadow:0 5px 0 #93301d,0 5px 0 3px var(--o),inset 0 2px 0 rgba(255,255,255,.5)}
.ribbon.coral::before,.ribbon.coral::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'><path d='M38 4H4l10 19L4 42h34z' fill='%23c84a32' stroke='%2316243b' stroke-width='3.2' stroke-linejoin='round'/><path d='M38 4v38' stroke='%2316243b' stroke-width='3.2'/><path d='M8 8h27' stroke='%23ff9b84' stroke-width='2.4' stroke-linecap='round' opacity='.8'/></svg>")}
.ribbon small,.ribbon .place{font-family:var(--body);font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#6a3b00;letter-spacing:.12em}
.ribbon.coral small,.ribbon.coral .place{color:#7a2414}
.ribbon .new{font-family:var(--body);font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#5a3300;background:rgba(255,255,255,.5);border:2px solid rgba(22,36,59,.25);font-size:12.5px;letter-spacing:.02em}
.ribbon .new.tag{background:#6a4bd8;color:#fff;border-color:var(--o)}
.card .ribbon{top:-22px;position:absolute}
#banner .ribbon{position:relative;z-index:0}

/* results */
.stars{top:-118px;gap:0}
.stars svg{width:62px;height:62px;filter:drop-shadow(0 4px 0 rgba(13,23,38,.7))}
.stars svg:nth-of-type(1){rotate:-14deg}.stars svg:nth-of-type(3){rotate:14deg}
.stars svg:nth-of-type(2){width:80px;height:80px;margin:0 -2px 16px}
@keyframes loreIn{to{opacity:.95}}
.stars svg.show{animation:slam .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
.stars .glow{position:absolute;left:50%;top:-6px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(rgba(255,214,90,.55),rgba(255,214,90,0) 65%);opacity:0;transition:opacity .6s}
.stars.lit .glow{opacity:1}
.res{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.res .tu{width:62px;height:62px;flex:none;animation:tbob 2.2s ease-in-out infinite}.res .tu svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(13,23,38,.55))}
@keyframes tbob{50%{transform:translateY(-4px) rotate(-5deg)}}
.big{font-size:62px;line-height:.95;--sw:7px;text-shadow:0 4px 0 var(--o);font-variant-numeric:tabular-nums}
.big span{font-size:30px;color:#dbe7f8;--sw:3.5px;margin-left:4px;text-shadow:0 2px 0 var(--o)}
.res .lbl{display:block;margin-top:4px;text-align:left}
.srow{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;display:flex;align-items:center;gap:7px;background:var(--cr2);border:2px solid var(--cr3);border-radius:14px;padding:6px 9px;font-family:var(--body);font-weight:800;font-size:14px;color:var(--txt);text-align:left;min-width:0}
.stat svg{width:24px;height:24px;flex:none}
.stat .bar{height:12px;border:2px solid var(--o);background:#e4d4ae;min-width:40px}
.stat .bar i{background:repeating-linear-gradient(-45deg,#2bb3c4 0 7px,#46c9d6 7px 14px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45);border-radius:0}
.goal{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-family:var(--body);font-weight:800;font-size:13.5px;color:var(--sub)}
.goal svg{width:20px;height:20px}.goal b{color:var(--txt)}
.note{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#efe5cc;border:2px solid #d8c69d;border-radius:16px;padding:9px 11px;margin-top:10px;box-shadow:inset 0 3px 5px rgba(22,36,59,.1),0 2px 0 rgba(255,255,255,.85)}
.note .badge{flex:none;width:34px;height:34px;border-radius:11px;border:2.5px solid var(--o);background:linear-gradient(#93e06a,#4fb23a);display:grid;place-items:center;box-shadow:0 2px 0 var(--o)}
.note .badge svg{width:22px;height:22px}
.note small{display:block;font-family:var(--body);font-weight:800;font-size:10.5px;letter-spacing:.16em;color:#3f8a2c;margin-bottom:1px}
.note p{margin:0;font-family:var(--body);font-weight:700;font-size:13.5px;line-height:1.38;color:var(--txt);text-wrap:pretty}
.hearts{display:flex;justify-content:center;gap:3px;margin-top:8px}.hearts svg{width:22px;height:22px}
.pop-in{animation:popin .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.card.skip *{animation-delay:0s!important}

/* home */
#start{padding:calc(11vh + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#start button{width:auto;max-width:none;min-height:0;font-size:inherit;animation:none}
#start h1{font-family:var(--mark);font-weight:400;font-size:76px;line-height:.86;white-space:nowrap;color:#fff4d6;-webkit-text-stroke:10px var(--o);paint-order:stroke fill;letter-spacing:.015em;text-shadow:0 3px 0 var(--o),0 6px 0 var(--o),0 9px 0 #0d1726,0 16px 24px rgba(0,0,0,.35);animation:floaty 3.4s ease-in-out infinite}
#start h1 svg{width:88px;height:88px;margin-bottom:2px;filter:drop-shadow(0 4px 0 var(--o))}

/* map */
.map{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><path d='M0 30q15-12 30 0t30 0 30 0 30 0' fill='none' stroke='%23ffffff' stroke-opacity='.06' stroke-width='3'/></svg>"),radial-gradient(120% 60% at 50% 110%,#2f8f96 0%,rgba(47,143,150,0) 60%),linear-gradient(#0b1a38,#123160 40%,#1a5878 80%,#2a7c86)}
.maptop{padding:calc(12px + env(safe-area-inset-top,0px)) 12px 8px;background:linear-gradient(rgba(8,16,34,.75),rgba(8,16,34,0))}
.maptitle{font-family:var(--mark);font-weight:400;font-size:28px;--sw:7px;text-shadow:0 3px 0 var(--o),0 5px 0 var(--o2)}
.node{width:64px;height:64px;border-radius:50%;font-size:26px;--sw:5px;margin:0;--lip:#2b6a1d;overflow:visible}
.node.done{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 50%),linear-gradient(#93e06a,#43a02e);--lip:#2b6a1d;color:#fff}
.node.cur{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 50%),linear-gradient(#ffe27a,#ee9c12);--lip:#a36300;color:#fff;animation:none}
.node.cur::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid rgba(255,214,90,.75);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
.node.lock{background:linear-gradient(#34507d,#22385e);--lip:#111e34;color:#8fa2c4}
.node.lock svg{width:24px;height:24px;filter:drop-shadow(0 2px 0 var(--o))}
.node.boss{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 50%),linear-gradient(#ff9c7d,#dc4f34);--lip:#93301d}
.node.boss.lock{background:linear-gradient(#5a4064,#3e2b48);--lip:#24182b}
.node.big{width:76px;height:76px;margin:-6px 0 0 -6px}
.node .crown{position:absolute;left:50%;top:-30px;width:36px;height:28px;margin-left:-18px}
.node .crown svg{width:100%;height:100%;filter:drop-shadow(0 2px 0 var(--o))}
.node .me{position:absolute;left:50%;top:-58px;width:52px;height:52px;margin-left:-26px;animation:tbob 1.8s ease-in-out infinite;pointer-events:none}
.node .me svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 var(--o))}
.node em{bottom:-20px;background:linear-gradient(#24406b,#1b2f52);border:2.5px solid var(--o);border-radius:99px;padding:2px 4px;gap:0}
.node em i{width:15px;height:15px;background:#4d6390}.node em i.on{background:#ffd23f}
.node em:empty{display:none}
.chap{width:270px;left:50%;right:auto;margin-left:-135px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/></svg>"),var(--cr);border:3px solid var(--o);border-radius:16px;box-shadow:0 5px 0 var(--o2),inset 0 2px 0 #fff;padding:7px 10px 8px;color:var(--txt);font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:0;text-transform:none;opacity:1;-webkit-text-stroke:0;text-shadow:none}

.mapbot{gap:12px;align-items:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(8,16,34,0),rgba(8,16,34,.8))}
.mapbot button{margin-bottom:6px}
.mapbot .sq{flex:none;width:62px;min-height:62px;padding:0;border-radius:18px}
.mapbot .sq svg{width:32px;height:32px}
.mapbot #mplay{flex:1}

/* shop, pause, crew, settings rows */
.offer{display:flex;align-items:center;gap:10px;background:var(--cr2);border:2px solid var(--cr3);border-radius:16px;padding:8px 8px 8px 8px;margin-top:8px;text-align:left}

.offer span{font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--sub)}

.demo{margin-top:10px;font-family:var(--body);font-weight:800;font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tog button.off{filter:saturate(.2) brightness(.85)}
.crewgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.crewgrid div{aspect-ratio:1;border-radius:16px;border:2.5px solid var(--o);background:linear-gradient(#3a5a8e,#1d3558);display:grid;place-items:center;box-shadow:0 3px 0 var(--o)}
.crewgrid svg{width:70%;height:70%;filter:brightness(0) opacity(.35)}
.crewgrid div:first-child svg{filter:drop-shadow(0 3px 0 var(--o))}
.prog{display:flex;align-items:center;gap:8px;margin-top:6px}.prog .bar{height:14px;border:2px solid var(--o);background:#e4d4ae}.prog .bar i{background:linear-gradient(#93e06a,#43a02e);box-shadow:inset 0 2px 0 rgba(255,255,255,.4);border-radius:0}
.prog .bar{position:relative;overflow:visible}.prog .bar em{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--o);border-radius:3px}.prog .bar em::after{content:'';position:absolute;top:-8px;left:-5px;width:14px;height:10px;background:#ffd23f;border:2px solid var(--o);border-radius:3px;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.prog b{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--txt);white-space:nowrap}
.adbox{border:3px solid var(--o);box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}

/* power button joins the family */
#power{border:3px solid var(--o);box-shadow:0 4px 0 var(--o2)}#power .in{border:3px solid var(--o);background:linear-gradient(#2c4673,#1b2e50)}
#power .cnt{border:2.5px solid var(--o);font-family:var(--disp);-webkit-text-stroke:0}

#app .iconbtn,#power,.node{margin:0}
/* map: living coastline */
.scroller{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}.scroller::-webkit-scrollbar{display:none}
.map{background:radial-gradient(130% 50% at 50% 100%,rgba(43,179,196,.35),rgba(43,179,196,0) 70%),linear-gradient(#081633,#0e2a55 35%,#114064 70%,#165a74)}
.track svg .foam{animation:foam 5s linear infinite}
@keyframes foam{to{stroke-dashoffset:-72}}
.track svg .sw{transform-box:fill-box;transform-origin:center;animation:swim 7s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(-14px,0) rotate(-70deg)}50%{transform:translate(14px,-6px) rotate(70deg)}}
.track svg .beam{transform-box:view-box;animation:beam 4s ease-in-out infinite;transform-origin:0 -20px}
.track svg .lh .beam{transform-box:fill-box;transform-origin:0% 50%}
@keyframes beam{0%,100%{opacity:.05;transform:rotate(-30deg)}50%{opacity:.35;transform:rotate(25deg)}}
.track svg .fish{transform-box:fill-box;animation:fish 3.5s ease-in-out infinite}
@keyframes fish{50%{transform:translate(-18px,6px)}}
.chapbar{position:relative;z-index:2;margin:0 auto 4px;width:calc(100% - 24px);max-width:380px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/></svg>"),#fdf6e2;border:3px solid var(--o);border-radius:16px;box-shadow:inset 0 2px 0 #fff,inset 0 -4px 0 #e4d4ae,0 4px 0 var(--o),0 10px 18px rgba(0,0,0,.35);padding:5px 10px 7px;text-align:center}
.chapbar small{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.18em;color:#b07a10;text-transform:uppercase}
.chapbar b{display:block;font-family:var(--disp);font-weight:700;font-size:16px;color:var(--txt);line-height:1.1}
.chapbar .cb{display:flex;align-items:center;gap:6px;margin-top:4px}
.seg{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:12px;padding:2px;background:#e4d4ae;border:2px solid var(--o);border-radius:99px}
.seg i{border-radius:99px;background:rgba(22,36,59,.1)}.seg i.on{background:linear-gradient(#93e06a,#43a02e);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.seg i.new{animation:segpop .6s .9s both}@keyframes segpop{0%{transform:scaleY(.2);filter:brightness(2)}60%{transform:scaleY(1.5)}}
.cico{flex:none;width:34px;height:30px;display:grid;place-items:center}.cico svg{width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(13,23,38,.6))}
.cico.near svg{animation:chestshake 1.6s ease-in-out infinite}
@keyframes chestshake{0%,70%,100%{transform:none}75%{transform:rotate(-9deg) scale(1.08)}85%{transform:rotate(9deg) scale(1.08)}92%{transform:rotate(-4deg)}}
.chapmark{position:absolute;left:8px;display:flex;align-items:center;gap:4px;background:rgba(9,18,38,.72);border:2px solid var(--o);border-radius:99px;padding:3px 10px;font-family:var(--disp);font-weight:700;font-size:12px;color:#fff;z-index:1;pointer-events:none}
.chapmark svg{width:14px;height:14px}
.node span{font-size:26px}
.node.lock span{color:#c3d0e8;-webkit-text-stroke:4px var(--o);opacity:.95}
.node .lk{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#24406b;border:2.5px solid var(--o);display:grid;place-items:center}
.node .lk svg{width:15px;height:15px;filter:none}
.node .hz{position:absolute;left:-8px;top:-6px;width:26px;height:26px;border-radius:50%;background:#fdf6e2;border:2.5px solid var(--o);display:grid;place-items:center;box-shadow:0 2px 0 var(--o)}
.node .hz svg{width:17px;height:17px;filter:none}
.node .crown.chest{top:-34px;width:42px;height:36px;margin-left:-21px}
.node.unlocked .lk{animation:lkpop .55s cubic-bezier(.3,1.6,.5,1) forwards}
.node.unlocked{animation:nodepop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes lkpop{40%{transform:scale(1.5) rotate(-20deg)}100%{transform:scale(0) rotate(40deg) translateY(-20px);opacity:0}}
@keyframes nodepop{40%{transform:scale(1.22)}}
.meT{position:absolute;width:52px;height:52px;pointer-events:none;z-index:3;display:block}
.meT svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 var(--o));animation:tbob 1.8s ease-in-out infinite}
.mapbot{background:rgba(9,20,40,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:2px solid rgba(255,255,255,.1);padding-top:10px}
.dkm{display:flex;flex-direction:column;align-items:center;gap:2px}
.dkm span{font-family:var(--disp);font-weight:700;font-size:12px;color:#fff;-webkit-text-stroke:3px var(--o);paint-order:stroke fill;text-shadow:0 1px 0 var(--o)}
.mapbot .sq{width:58px;min-height:58px}
/* results: chapter chest + reward */
.chp{margin-top:10px;background:var(--cr2);border:2px solid var(--cr3);border-radius:14px;padding:6px 9px 7px}
.chp-t{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--txt)}
.chp-t b{font-variant-numeric:tabular-nums}
.chp-b{display:flex;align-items:center;gap:6px;margin-top:3px}
.chp-s{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--body);font-weight:800;font-size:12.5px;color:var(--sub);margin-top:4px}.chp-s svg{width:16px;height:16px}.chp-s b{color:var(--txt)}
.reward{display:flex;gap:10px;align-items:center;text-align:left;margin-top:10px;background:linear-gradient(#fff3c4,#ffe08a);border:3px solid var(--o);border-radius:16px;padding:8px 10px;box-shadow:inset 0 2px 0 #fff,0 3px 0 var(--o)}
.reward .rc{flex:none;width:50px;height:44px;animation:chestshake 1.4s 1.4s ease-in-out 2}.reward .rc svg{width:100%;height:100%}
.reward b{display:block;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--txt)}
.reward span{font-family:var(--body);font-weight:700;font-size:12.5px;color:#5d4a1e;line-height:1.3}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}body{-webkit-touch-callout:none;overscroll-behavior:none}
img,svg{-webkit-user-drag:none}
#rot{display:none;position:absolute;inset:0;z-index:40;background:#12203A;color:#fff;place-items:center;text-align:center;font-family:var(--disp);font-weight:700;font-size:22px;-webkit-text-stroke:4px var(--o);paint-order:stroke fill;padding:20px}

@keyframes rotph{50%{transform:rotate(-90deg)}}
@media (orientation:landscape) and (max-height:500px){#rot{display:grid}}
#power::after{content:'BOOST';position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.08em;color:#fff;-webkit-text-stroke:3px var(--o);paint-order:stroke fill}
#power{overflow:visible}
button{white-space:nowrap}
@media (max-width:360px){#start .tag{font-size:12px;letter-spacing:.14em}#start h1{font-size:66px}.btns .duo button,.tog button{font-size:14px;gap:4px}.btns .duo button svg,.tog button svg{width:18px;height:18px}.hero{font-size:21px}.b-teal{font-size:15px}.big{font-size:54px}.inner{padding-left:12px;padding-right:12px}.mapbot #mplay{font-size:21px}}
@media (max-height:640px){.stars{top:-92px}.stars svg{width:48px;height:48px}.stars svg:nth-of-type(2){width:62px;height:62px;margin-bottom:12px}.card{margin-top:60px}.res .tu{width:48px;height:48px}.srow,.goal{margin-top:8px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.stars svg{opacity:1;transform:none}#start .lore{opacity:.9}}
@media (max-height:640px){#start{padding-top:calc(6vh + env(safe-area-inset-top,0px))}#start h1{font-size:62px}#start h1 svg{width:70px;height:70px}.card{margin-top:70px}.inner{padding-top:34px}.note{display:none}}

/* ================= LAUNCH PUSH: motion, map 2.0, crew, guide ================= */
/* iOS-style motion: springs on transform/opacity only */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
button:active{transform:translateY(3px) scale(.97)}
.veil.out{animation:vout .22s var(--ease) forwards;pointer-events:none}
.veil.out .card{animation:cout .22s var(--ease) forwards}
@keyframes vout{to{opacity:0}}@keyframes cout{to{transform:translateY(26px) scale(.94);opacity:0}}
.map{animation:mapin .42s var(--ease)}@keyframes mapin{from{opacity:0;transform:scale(1.04)}}
#app.clean .hud,#app.clean #power,#app.clean #banner,#app.clean #cap,#app.clean #toast{display:none!important}
/* home */
#daily{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top,0px));pointer-events:auto;width:auto;min-width:58px;height:58px;flex-direction:column;gap:0;padding:4px 8px 6px;border-radius:16px}
#daily svg{width:28px;height:28px}#daily span{font-family:var(--disp);font-weight:700;font-size:11px;color:#fff;-webkit-text-stroke:3px var(--o);paint-order:stroke fill;line-height:1}
#daily b{position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:#ef4c3c;border:2.5px solid var(--o);animation:pulseBtn 1.2s infinite}
#hguide i{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 50%),linear-gradient(#a4ee70,#329a25);--lip:#1f6a16}
.dock{gap:16px}.dk i svg{width:34px;height:34px}#hcrew i svg{width:44px;height:44px}
.dk em{background:#ef4c3c}
#start h1 svg{width:96px;height:96px}

#toast{left:50%;right:auto;transform:translate(-50%,-10px);width:max-content;max-width:calc(100% - 28px);background:linear-gradient(#fffdf5,#f3e8cc);border:3px solid var(--o);border-radius:99px;padding:5px 14px 5px 6px;box-shadow:0 4px 0 var(--o2);font-family:var(--body);font-size:14px;top:calc(64px + env(safe-area-inset-top,0px))}
#toast.on{transform:translate(-50%,0)}#toast svg{width:28px;height:28px}#toast b{color:var(--txt)}
/* banner bonus goal */
.ribbon .goalb{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;font-family:var(--body);font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#fff;background:rgba(22,36,59,.82);border-radius:99px;padding:3px 10px 3px 4px;font-size:12px;white-space:normal}.ribbon .goalb svg{width:18px;height:18px;flex:none}

.node.pre{opacity:0;transform:scale(.5)}

.sa-svg{width:100%;height:auto;display:block}
.sa-p{cursor:pointer;transition:filter .2s}.sa-p.lock{filter:saturate(.25) brightness(.95)}.sa-p.sel{filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
.sa-in{transform-box:fill-box;transform-origin:50% 100%}.sa-p.built .sa-in{animation:sabuild .7s var(--spring)}
@keyframes sabuild{0%{transform:scale(.4,.2)}60%{transform:scale(1.1,1.15)}100%{transform:none}}
.sa-ring{animation:saring 1.6s linear infinite}@keyframes saring{to{stroke-dashoffset:-26}}
.sa-up{animation:saup 1.2s ease-in-out infinite}@keyframes saup{50%{transform:translateY(-4px)}}
.sa-w1{animation:saw 3s ease-in-out infinite}.sa-w2{animation:saw 3.6s ease-in-out infinite reverse}@keyframes saw{50%{transform:translateX(6px)}}
.sa-info{display:flex;gap:10px;align-items:center;text-align:left;margin-top:10px;background:#efe5cc;border:2px solid #d8c69d;border-radius:16px;padding:8px 10px}
.sa-info.boom{animation:pipop .45s var(--spring)}
.sa-ic{flex:none;width:64px;height:54px;border-radius:14px;background:linear-gradient(#bff0ea,#8fd6cf);border:2.5px solid var(--o);display:grid;place-items:center}.sa-ic svg{width:60px;height:48px}
.sa-tx{min-width:0}.sa-tx b{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--txt)}
.sa-lv{display:inline-flex;gap:4px;margin-left:8px;vertical-align:2px}.sa-lv i{width:13px;height:13px;border-radius:50%;background:#d8c69d;border:2px solid rgba(22,36,59,.35)}.sa-lv i.on{background:linear-gradient(#ffe27a,#ee9c12);border-color:var(--o);box-shadow:0 0 6px rgba(255,200,40,.8)}
.sa-now,.sa-nx{display:block;font-family:var(--body);font-weight:800;font-size:12.5px;line-height:1.3;color:var(--txt)}.sa-nx{color:var(--sub);display:flex;gap:4px;align-items:center}.sa-nx svg{width:12px;height:12px;flex:none}
.sanct .btns{display:grid;gap:10px;margin-top:12px}.sa-why{display:block;margin-top:3px;font-family:var(--body);font-weight:700;font-style:italic;font-size:11.5px;line-height:1.3;color:#3f8a2c}
.b-purple{background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 48%),linear-gradient(#c9b0ff,#9a74ee 62%,#7a52d8);--lip:#4a2d96;color:#fff}
.mapbot .b-purple svg{width:40px;height:40px}.mapbot .sq{position:relative}
.mapbot .nb{position:absolute;top:-11px;right:-3px;font-style:normal;font-family:var(--disp);font-weight:700;font-size:10.5px;color:#fff;background:#ef4c3c;border:2px solid var(--o);border-radius:99px;padding:1px 6px;-webkit-text-stroke:0;text-shadow:none;letter-spacing:.04em;animation:pulseBtn 1.4s infinite}
.sanct .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sanct .duo button svg{width:26px;height:26px}
.gsec{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--txt);text-align:left;margin:12px 2px 6px}.gsec small{display:block;font-family:var(--body);font-weight:800;font-size:12px;color:var(--sub);margin-top:1px}.gboost .gic{background:linear-gradient(#2c4673,#1b2e50)}
/* swim frenzy: a clear goal, a clear skip */
.swim .sw-n{gap:4px;padding-right:12px}.swim .sw-n em{font-style:normal;font-family:var(--disp);font-weight:700;font-size:14px;opacity:.85;-webkit-text-stroke:2.5px var(--o);paint-order:stroke fill}
.swim .sw-n .sw-bo{display:grid;place-items:center;width:22px;height:22px;opacity:.35;filter:grayscale(1);transition:opacity .3s,filter .3s}.swim .sw-n .sw-bo svg{width:20px;height:20px}
.swim .sw-n.got .sw-bo{opacity:1;filter:none;animation:pipop .45s var(--spring)}
.swim .sw-n .sw-bo[data-n="2"]::after{content:'×2';font-family:var(--disp);font-weight:700;font-size:11px;color:#fff;-webkit-text-stroke:2.5px var(--o);paint-order:stroke fill;position:relative;left:12px;top:-14px;grid-area:1/1}
.swim .sw-skip{display:flex;align-items:center;gap:2px;height:40px;padding:0 10px 0 14px;border-radius:99px;font-family:var(--disp);font-weight:700;font-size:16px;color:#fff;-webkit-text-stroke:3px var(--o);paint-order:stroke fill;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.swim .sw-skip svg{width:20px;height:20px;filter:drop-shadow(0 2px 0 rgba(13,23,38,.8))}.swim .sw-skip:active{transform:scale(.94)}
.sw-ban{flex-direction:column;align-items:center;gap:14px}
.sw-sub{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:700;font-size:17px;color:#fff;-webkit-text-stroke:4px #0d2a4a;paint-order:stroke fill;text-shadow:0 3px 0 #0d2a4a;padding:0 20px;text-align:center}.sw-sub svg{width:24px;height:24px;flex:none}
</style>
</head>

    c.fillStyle = col[1]; for (const [dx, dy] of [[-6, -5], [6, -5], [0, -9]]) { c.beginPath(); c.arc(dx, dy, 2.2, 0, Math.PI * 2); c.fill(); }

  }
  function drawRaft(x, y) {   // a floating mat of golden seaweed with little air bladders
    const c = cx; c.save(); c.translate(x, y); c.scale(U, U);
    for (let i = 0; i < 26; i++) { const a = i * 2.4, r = 20 + (i % 7) * 9, px2 = Math.cos(a) * r * 1.5, py2 = Math.sin(a) * r * .7; c.fillStyle = i % 3 ? '#c99a3c' : '#e0b450'; c.save(); c.translate(px2, py2); c.rotate(a + Math.sin(t + i) * .2); c.beginPath(); c.ellipse(0, 0, 13, 5, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
    c.fillStyle = '#f2cf6a'; for (let i = 0; i < 18; i++) { const a = i * 1.9, r = 14 + (i % 5) * 12; c.beginPath(); c.arc(Math.cos(a) * r * 1.4, Math.sin(a) * r * .6, 3.4, 0, Math.PI * 2); c.fill(); }

      <div class="res"><div class="tu">${ICON.turtle(skinNow)}</div><div><div class="big"><b>0</b><span> / ${opt.n}</span></div><div class="lbl">reached the open sea</div></div></div>

      ${!skipped && tangles === 0 ? `<div class="bonus met">${ICON.check}<span>Nobody got tangled</span><b>+2</b></div>` : ''}
      ${boosts ? `<div class="reward pop-in" style="animation-delay:.7s"><div class="rc">${ICON.bolt}</div><div><b>+${boosts} boost${boosts > 1 ? 's' : ''} saved</b><span>On any level, tap the glowing boost button to use it</span></div></div>` : `<div class="goal">${ICON.bolt}Clear ${SW_GOAL[0]} pieces next time to win a boost</div>`}
      ${fieldNote(FACTCARD.sea)}
      <div class="btns"><button class="b-green hero pop-in" id="swc" style="animation-delay:.35s">${ICON.play}Continue</button></div></div></div>`;
    el.appendChild(v); countUp(v.querySelector('.big b'), reached, 600); if (shells) setTimeout(() => { countUp(v.querySelector('.stat.sh b'), shells, 500); sfx.coin(); }, 600);
    v.querySelector('#swc').onclick = () => { au(); wipe(() => { gone = true; cancelAnimationFrame(raf); removeEventListener('resize', size); el.remove(); swimOn = false; opt.onDone(); }); };
  }
  el._dbg = { L, J, school, top: () => camTop() };
  const frame = (ts) => { if (gone) return; const raw = Math.min(.05, (ts - lastTs) / 1000 || 0) * (opt.ts || 1); lastTs = ts; update(raw * slow); draw(); raf = requestAnimationFrame(frame); };
  raf = requestAnimationFrame(frame);
}

/* ---- playable.js ---- */
/* ===================== PLAYABLE AD: "The Great Hatch" =====================
   A 25 to 35 second superlevel built from the real game: same turtles, same taps, same feel.
   Beats: one rescue (slow-mo hook) -> a few hatchlings + trash -> one telegraphed gull -> three nests burst -> the procession reaches the sea -> end card.
   No forced failure, no fake mechanics, the store only opens when the player taps the button. */
const STORE = { ios: 'https://shellrun.netlify.app/', android: 'https://shellrun.netlify.app/', web: 'https://shellrun.netlify.app/' };
function triggerAdCTA(where) {
  track('cta', { where }); const ua = navigator.userAgent || '', url = /iPhone|iPad|iPod/.test(ua) ? STORE.ios : /Android/.test(ua) ? STORE.android : STORE.web;
  try { if (self.mraid && mraid.open) { mraid.open(url); return; } } catch (e) {}
  try { if (self.FbPlayableAd && FbPlayableAd.onCTAClick) { FbPlayableAd.onCTAClick(); return; } } catch (e) {}
  try { if (self.ExitApi && ExitApi.exit) { ExitApi.exit(); return; } } catch (e) {}
  try { if (self.dapi && dapi.openStoreUrl) { dapi.openStoreUrl(); return; } } catch (e) {}
  window.open(url, '_blank');
}
let playEnd = () => {};
if (PLAY) (function () {
  const PSPEC = { name: 'The Great Hatch', mood: 'moon', terrain: 'gold', fresh: 22, nests: 3, litter: 0, tangle: 0, rocks: 0, castles: 0, crabs: 1, crabT: 999, crabSpd: .9, burrow: 0, gulls: 1, tourists: 0, balls: 0, spawn: .34, teach: 'play', fact: '', gold: 0 };
  _spec[90000] = PSPEC;
  const app = $('#app'); app.classList.add('playing', 'playable');
  const st0 = $('#start'); if (st0) st0.remove();
  started = true; attract = false; Object.assign(season, { met: 0, saved: 0, spawned: 0, binned: 0 });
  let stage = 'hook', tStage = 0, tAll = 0, firstTap = false, hookT = null, cardShown = false, idle = 0;
  const brand = document.createElement('div'); brand.className = 'pbrand'; brand.innerHTML = `<img src="${LOGO_SRC}" alt="Shell Run">`; app.appendChild(brand);
  const cta = document.createElement('button'); cta.className = 'b-green pcta'; cta.innerHTML = 'Get it free'; cta.onclick = (e) => { e.stopPropagation(); triggerAdCTA('pill'); }; app.appendChild(cta);
  const release = (k, spawnGap) => { for (let i = 0; i < k; i++) nests[i % nests.length].left++; spawnLeft += k; spec.spawn = spawnGap; spawnT = Math.min(spawnT, .2); };
  const start = () => {
    begin(90000); running = true; powerKind = null; ui.power(); for (const g of gulls) g.t = 999; spawnLeft = 0; for (const n of nests) n.left = 0; playHold = true; introT = 0; goal = null; goldIdx = 10;
    // the hook: one hatchling already on its back near the sea, waiting for you
    nests[1].left = 1; spawnLeft = 1; spawnTurtle(); hookT = T[0]; Object.assign(hookT, { x: .4, z: SHORE_Z + 3.4, born: 2, hd: Math.PI, keep: true }); flip(hookT); hookT.flipT = 99;
    ui.cap('Help this little one!', 99); track('ad_start', {}); shake = 0;
  };
  // pace the beats; called every frame from the loop (returns the time step to use)
  playTick = (raw, dt) => {
    tAll += raw; tStage += raw; if (cardShown) return dt * .06;
    if (stage === 'hook') {
      if (hookT && hookT.st !== 'flip') { stage = 'grow'; tStage = 0; firstTap = true; track('first_tap', { t: tAll }); ui.cap('It made it! More are hatching…', 2.2); setTimeout(() => { release(5, .42); for (const [x, z] of [[-2.1, NEST_Z - 3.1], [2.3, NEST_Z - 3.4], [0, NEST_Z - 4.6]]) addLitter(pick(['bottle', 'can', 'cup']), x, z); }, 900); }
      if (hookT) hookT.flipT = 99;
      if (tAll > 7 && !firstTap) { ui.cap('Tap the turtle to flip it!', 99); }
      return dt * .22;   // slow motion until the first touch
    }
    if (stage === 'grow') {
      if (tStage > 6.5 || (spawnLeft === 0 && safeN >= 4)) { stage = 'gull'; tStage = 0; for (const g of gulls) { g.t = .1; } track('stage', { s: 'gull' }); }
      return dt * 1.15;
    }
    if (stage === 'gull') {
      const g = gulls[0], diving = g && (g.st === 'dive' || g.st === 'carry');
      if (diving && !hand) hand = { o: g, y: g.y, kind: 'gull' };
      if (hand && hand.kind === 'gull') { hand.y = g.y; if (!diving) { hand = null; ui.capOff(); } }

    }
    if (stage === 'surge') {

  };
  function surge() {

    $('#bannerT').className = 'ribbon coral'; $('#bannerT').innerHTML = `<small>ALL THREE NESTS</small>The Great Hatch!<span class="new">Clear their path to the sea</span>`;
    $('#banner').classList.add('on'); setTimeout(() => $('#banner').classList.remove('on'), 2600);

    setTimeout(() => {

      v.innerHTML = `<div class="card"><div class="stars"><div class="glow"></div>${[0, 1, 2].map((i) => i < (safeN >= total - 1 ? 3 : safeN >= total * .8 ? 2 : 1) ? ICON.star : ICON.starOff).join('')}</div><div class="ribbon">You saved ${safeN}!</div><div class="inner">
        <div class="ptop"><img src="${LOGO_SRC}" alt="Shell Run"></div>
        <div class="ptitle">A whole coast is waiting</div>
        <div class="goal">100 beaches · crabs, gulls, waves and storms · real turtle facts</div>
        <div class="btns"><button class="b-green hero pcta2" id="pg">${ICON.play}Play Shell Run · Free</button><button class="b-navy" id="pr">${ICON.retry}Replay</button></div></div></div>`;
      $('#app').appendChild(v); v.querySelectorAll('.stars svg').forEach((s, i) => setTimeout(() => { s.classList.add('show'); tone(note(4 + i * 2), .35, 'triangle', .13, 0, 0, .5); }, 200 + i * 200));
      v.querySelector('#pg').onclick = () => triggerAdCTA('endcard');

  };

  const go = () => { start(); };
  try { if (self.mraid && mraid.getState && mraid.getState() === 'loading') mraid.addEventListener('ready', go); else go(); } catch (e) { go(); }

})();
