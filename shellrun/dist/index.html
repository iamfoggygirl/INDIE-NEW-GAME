:root{color-scheme:dark;--navy:#12203A;--frame:#1d3157;--frame2:#29426f;--cream:#fbf1d8;--cream2:#f3e3bf;--ink:#1b2433;--muted:#6a7186;--green:#7DB05A;--green2:#4f7d36;--teal:#6fd1c8;--teal2:#3d9e96;--gold:#E0B040;--coral:#E8664A;--red:#D93A3A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0b1428;overflow:hidden;font-family:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;margin:0 auto;height:100%;max-width:560px;overflow:hidden;background:#12203A}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov2{z-index:2}
.hud{opacity:0;transition:opacity .4s;position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;z-index:5}
.pill{background:rgba(18,32,58,.82);border:2px solid rgba(255,243,196,.18);border-radius:999px;padding:5px 12px 5px 7px;font-weight:900;font-size:18px;color:var(--cream);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill svg{width:28px;height:28px;flex:none}
.pill .sub{font-size:13px;opacity:.7}
.pill.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.18)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#app.playing .hud{opacity:1}
#lostP{opacity:0;transform:scale(.6);transition:.3s cubic-bezier(.2,1.6,.4,1);gap:1px;padding:6px 9px}
#lostP.on{opacity:1;transform:none}
#lostP .ht{display:inline-flex;width:19px;height:19px}
#lostP .ht svg{width:100%;height:100%}
#lostP .ht.brk{animation:hbrk .7s ease-out}
#lostP.last .ht:not(.gone){animation:hbeat 1.1s infinite}
@keyframes hbrk{0%{transform:scale(1.6) rotate(-12deg);filter:brightness(2)}40%{transform:scale(.7) rotate(14deg)}100%{transform:none}}
@keyframes hbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.dangerV{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 80px 8px rgba(232,102,74,.6)}
.dangerV.on{opacity:1;animation:dng 1.15s infinite}
@keyframes dng{0%,100%{opacity:.35}15%{opacity:1}45%{opacity:.6}}
.ribbon .new.tag{background:#6a4bd8}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,243,196,.18);background:rgba(18,32,58,.82);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.iconbtn svg{width:26px;height:26px}
.iconbtn:active{transform:scale(.92)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#banner{position:absolute;left:0;right:0;top:calc(108px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none;z-index:5;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s}
#banner.on{opacity:1;transform:none}
.ribbon{position:relative;background:var(--gold);color:#4a2f00;font-weight:900;font-size:21px;padding:8px 26px;border-radius:10px;box-shadow:0 4px 0 #a87b1c,0 10px 24px rgba(0,0,0,.35);text-wrap:balance;text-align:center;max-width:300px}
.ribbon.coral{background:var(--coral);color:#fff7ee;box-shadow:0 4px 0 #a8432d,0 10px 24px rgba(0,0,0,.35)}
.ribbon small{display:block;font-size:12px;letter-spacing:.12em;opacity:.75}.ribbon .place{display:block;font-size:11px;font-style:normal;font-weight:800;letter-spacing:.05em;opacity:.7;margin-top:1px}
#cap{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:23px;font-weight:900;color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;z-index:5;padding:0 16px;text-wrap:balance}
#cap.on{opacity:1;transform:none}
.veil{position:absolute;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;z-index:10;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{position:relative;margin-top:74px;background:var(--frame);border-radius:30px;padding:10px;width:100%;max-width:350px;box-shadow:0 8px 0 #0d1830,0 26px 50px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(24px);opacity:0}}
.inner{background:var(--cream);border-radius:22px;padding:44px 16px 16px;text-align:center}
.card .ribbon{position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;font-size:22px}
.stars{position:absolute;left:0;right:0;top:-104px;display:flex;justify-content:center;align-items:flex-end;gap:2px;pointer-events:none}

/* ================= STUDIO UI SYSTEM =================
   one language everywhere: thick navy outline, hard lip shadow, glossy top, outlined display type.
   tokens */
:root{--o:#16243b;--o2:#0d1726;--cr:#fdf6e2;--cr2:#f3e8cc;--cr3:#e4d4ae;--txt:#2c3e55;--sub:#5d6b85;
  --disp:"Fredoka",ui-rounded,system-ui,sans-serif;--body:"Nunito",ui-rounded,system-ui,sans-serif;--mark:"Lilita One","Fredoka",system-ui,sans-serif}
html,body{font-family:var(--body)}
.gt,button,.pill,.chip,#cap,.ribbon,.big,.node,.maptitle,.dk span{font-family:var(--disp);font-weight:700;letter-spacing:.01em;paint-order:stroke fill;-webkit-text-stroke:var(--sw,3px) var(--o);color:#fff;text-shadow:0 2px 0 var(--o)}
svg{-webkit-text-stroke:0}
.pill svg,.iconbtn svg,.chip svg,button svg,.dk i svg,.lbl svg,.stat svg{filter:drop-shadow(0 2px 0 rgba(13,23,38,.85))}

/* HUD */
.hud{transition:opacity .35s,transform .35s cubic-bezier(.4,0,.2,1)}
.pill{background:linear-gradient(#2c4673,#1b2e50);border:3px solid var(--o);box-shadow:0 4px 0 var(--o2),inset 0 2px 0 rgba(255,255,255,.2);font-size:19px;padding:4px 12px 4px 6px;--sw:3.5px}
.pill .sub{font-size:13px;opacity:1;color:#bcd0ee;--sw:3px}
.iconbtn{border:3px solid var(--o);border-radius:15px;width:46px;height:46px;background:linear-gradient(#2c4673,#1b2e50);box-shadow:0 4px 0 var(--o2),inset 0 2px 0 rgba(255,255,255,.2);min-height:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o2)}
#app.modal .hud,#app.modal #power,#app.modal #cap,#app.modal #banner{opacity:0!important;transform:translateY(-90px);pointer-events:none}
#app.modal #power,#app.modal #cap{transform:translateY(40px)}
#cap{font-size:24px;--sw:5px;text-shadow:0 3px 0 var(--o),0 0 18px rgba(0,0,0,.35)}

/* buttons: one family, three weights */
button{border:3px solid var(--o);border-radius:18px;min-height:54px;font-size:20px;padding:8px 18px;position:relative;overflow:hidden;--lip:#2d6e1e;
  box-shadow:0 5px 0 var(--lip),0 5px 0 3px var(--o),inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s;margin-bottom:8px;--sw:4px}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lip),0 1px 0 3px var(--o),inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.12)}
button:disabled{filter:saturate(.35) brightness(.92);cursor:default}
.b-green{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 48%),linear-gradient(#93e06a,#56bb3b 62%,#43a02e);--lip:#2b6a1d;color:#fff}
.b-navy{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0) 48%),linear-gradient(#3a5a8e,#24406b 62%,#1d3558);--lip:#0f1b2e;color:#fff;min-height:48px;font-size:17px}
.b-teal{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 48%),linear-gradient(#63e1d5,#22aebf 62%,#1a95a8);--lip:#0d5f6d;color:#fff;font-size:17px}
.b-gold{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 48%),linear-gradient(#ffe27a,#f8b52c 62%,#ee9c12);--lip:#a36300;color:#fff}
.b-coral{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0) 48%),linear-gradient(#ff9c7d,#ee6447 62%,#dc4f34);--lip:#93301d;color:#fff}
.hero{min-height:62px;font-size:24px;--sw:5px}
.hero::after{content:"";position:absolute;top:-30%;bottom:-30%;width:34%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:sheen 3.6s 1.4s infinite;pointer-events:none}
@keyframes sheen{0%{left:-50%}24%,100%{left:130%}}
.btns{display:grid;gap:6px;margin-top:14px;flex-direction:initial}
.btns .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .duo button{font-size:16px;padding:6px 8px;gap:6px}
.btns .duo button svg{width:20px;height:20px}

/* panels */
.veil{background:rgba(8,20,38,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{background:linear-gradient(#2c4a79,#1b2f52);border:3px solid var(--o);border-radius:30px;padding:8px;box-shadow:0 10px 0 var(--o2),0 10px 0 3px var(--o),0 30px 60px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.22);margin-top:86px;max-width:352px;animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
.inner{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/></svg>"),var(--cr);border-radius:22px;box-shadow:0 0 0 2px var(--o),inset 0 3px 0 #fff,inset 0 -5px 0 var(--cr3);padding:40px 16px 12px;color:var(--txt)}
.lbl{font-family:var(--body);font-weight:800;color:var(--sub);font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* ribbon with folded tails */
.ribbon{background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 50%),linear-gradient(#ffe27a,#f8b52c 60%,#ef9d14);border:3px solid var(--o);border-radius:13px;box-shadow:0 5px 0 #a36300,0 5px 0 3px var(--o),inset 0 2px 0 rgba(255,255,255,.65);font-size:24px;padding:7px 26px 8px;--sw:5px;max-width:310px}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:50%;width:30px;height:38px;margin-top:-12px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'><path d='M38 4H4l10 19L4 42h34z' fill='%23e08f10' stroke='%2316243b' stroke-width='3.2' stroke-linejoin='round'/><path d='M38 4v38' stroke='%2316243b' stroke-width='3.2'/><path d='M8 8h27' stroke='%23ffd77a' stroke-width='2.4' stroke-linecap='round' opacity='.8'/></svg>") center/100% 100% no-repeat;z-index:-1}
.ribbon::before{left:-27px}.ribbon::after{right:-27px;transform:scaleX(-1)}
.ribbon.coral{background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 50%),linear-gradient(#ff9c7d,#ee6447 60%,#dc4f34);box-shadow:0 5px 0 #93301d,0 5px 0 3px var(--o),inset 0 2px 0 rgba(255,255,255,.5)}
.ribbon.coral::before,.ribbon.coral::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'><path d='M38 4H4l10 19L4 42h34z' fill='%23c84a32' stroke='%2316243b' stroke-width='3.2' stroke-linejoin='round'/><path d='M38 4v38' stroke='%2316243b' stroke-width='3.2'/><path d='M8 8h27' stroke='%23ff9b84' stroke-width='2.4' stroke-linecap='round' opacity='.8'/></svg>")}
.ribbon small,.ribbon .place{font-family:var(--body);font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#6a3b00;letter-spacing:.12em}
.ribbon.coral small,.ribbon.coral .place{color:#7a2414}
.ribbon .new{font-family:var(--body);font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#5a3300;background:rgba(255,255,255,.5);border:2px solid rgba(22,36,59,.25);font-size:12.5px;letter-spacing:.02em}
.ribbon .new.tag{background:#6a4bd8;color:#fff;border-color:var(--o)}
.card .ribbon{top:-22px;position:absolute}
#banner .ribbon{position:relative;z-index:0}

/* results */
.stars{top:-118px;gap:0}
.stars svg{width:62px;height:62px;filter:drop-shadow(0 4px 0 rgba(13,23,38,.7))}
.stars svg:nth-of-type(1){rotate:-14deg}.stars svg:nth-of-type(3){rotate:14deg}
.stars svg:nth-of-type(2){width:80px;height:80px;margin:0 -2px 16px}
@keyframes loreIn{to{opacity:.95}}
.stars svg.show{animation:slam .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
.stars .glow{position:absolute;left:50%;top:-6px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(rgba(255,214,90,.55),rgba(255,214,90,0) 65%);opacity:0;transition:opacity .6s}
.stars.lit .glow{opacity:1}
.res{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.res .tu{width:62px;height:62px;flex:none;animation:tbob 2.2s ease-in-out infinite}.res .tu svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(13,23,38,.55))}
@keyframes tbob{50%{transform:translateY(-4px) rotate(-5deg)}}
.big{font-size:62px;line-height:.95;--sw:7px;text-shadow:0 4px 0 var(--o);font-variant-numeric:tabular-nums}
.big span{font-size:30px;color:#cfe0f7;--sw:5px}
.res .lbl{display:block;margin-top:4px;text-align:left}
.srow{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;display:flex;align-items:center;gap:7px;background:var(--cr2);border:2px solid var(--cr3);border-radius:14px;padding:6px 9px;font-family:var(--body);font-weight:800;font-size:14px;color:var(--txt);text-align:left;min-width:0}
.stat svg{width:24px;height:24px;flex:none}
.stat .bar{height:12px;border:2px solid var(--o);background:#e4d4ae;min-width:40px}
.stat .bar i{background:repeating-linear-gradient(-45deg,#2bb3c4 0 7px,#46c9d6 7px 14px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45);border-radius:0}
.goal{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-family:var(--body);font-weight:800;font-size:13.5px;color:var(--sub)}
.goal svg{width:20px;height:20px}.goal b{color:var(--txt)}
.note{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#f4ebd4;border:2px dashed #cdb985;border-radius:16px;padding:9px 11px;margin-top:10px}
.note .badge{flex:none;width:34px;height:34px;border-radius:11px;border:2.5px solid var(--o);background:linear-gradient(#93e06a,#4fb23a);display:grid;place-items:center;box-shadow:0 2px 0 var(--o)}
.note .badge svg{width:22px;height:22px}
.note small{display:block;font-family:var(--body);font-weight:800;font-size:10.5px;letter-spacing:.16em;color:#3f8a2c;margin-bottom:1px}
.note p{margin:0;font-family:var(--body);font-weight:700;font-size:13.5px;line-height:1.38;color:var(--txt);text-wrap:pretty}
.hearts{display:flex;justify-content:center;gap:3px;margin-top:8px}.hearts svg{width:22px;height:22px}
.pop-in{animation:popin .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.card.skip *{animation-delay:0s!important}

/* home */
#start{padding:calc(11vh + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#start button{width:auto;max-width:none;min-height:0;font-size:inherit;animation:none}
#start h1{font-family:var(--mark);font-weight:400;font-size:76px;line-height:.86;white-space:nowrap;color:#fff4d6;-webkit-text-stroke:10px var(--o);paint-order:stroke fill;letter-spacing:.015em;text-shadow:0 3px 0 var(--o),0 6px 0 var(--o),0 9px 0 #0d1726,0 16px 24px rgba(0,0,0,.35);animation:floaty 3.4s ease-in-out infinite}

<div id="app">

  <div id="start"><button class="iconbtn" id="gear" aria-label="Settings"></button><div class="top"><h1 id="title">Shell Run</h1><div class="tag">Guide the hatchlings home</div><div class="stats" id="tagstats"></div><div class="lore">We can't control the turtles.<br>We can clear what people left behind.</div></div><div class="bot"><div class="where" id="where"></div><button class="b-green hero" id="go"></button><div class="dock"><button class="dk" id="hmap"><i></i><span>Map</span></button><button class="dk" id="hcrew"><i></i><span>Crew</span><em>SOON</em></button><button class="dk" id="hshop"><i></i><span>Shop</span></button></div></div></div>
  <div id="ov"></div>
  <div id="load">Loading the beach…</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function () {
/* ---- core.js ---- */
/* ===================== CORE: helpers, palette, audio, renderer, curved world ===================== */
const $ = (s) => document.querySelector(s);
if (!self.THREE) { $('#load').textContent = 'Could not load 3D. Check your connection and reload.'; return; }
const THREE = self.THREE;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (a, b, c, d) => Math.hypot(a - c, b - d);
const pick = (a) => a[(Math.random() * a.length) | 0];
const ease = (t) => t * t * (3 - 2 * t);
const Q = new URLSearchParams(location.search);
const FAST = Q.has('fast');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Style bible palette (docs/11-art-bible.md). Lit colours are tuned slightly brighter so they read true under moonlight. */
const PAL = {
  sand: '#E6CFA0', wet: '#B89B70', teal: '#0E5E70', foam: '#BFE8E0', navy: '#12203A', moon: '#FFF3C4',
  coral: '#E8664A', green: '#7DB05A', shell: '#3E6B3A', gold: '#E0B040', litter: '#4FA3D9', red: '#D93A3A',
  skin: '#8cc063', cream: '#f3ead0'
};

/* ---------- world layout (ground is XZ, y up; turtles walk toward -z, the sea) ---------- */
const XMIN = -4.0, XMAX = 4.0, NEST_Z = 7.0, SHORE_Z = -6.2, ST0 = -1.4, ST1 = 0.4;
const MS = 1.6;                                      // character scale
const shore = (x, t) => SHORE_Z + Math.sin(x * .55 + t * 1.1) * .22 + Math.sin(t * .7) * .3;
function groundH(x, z) {
  let h = Math.max(0, z - SHORE_Z) * .022 + Math.sin(x * 1.3) * Math.cos(z * 1.1) * .03;
  if (z < SHORE_Z + .8) h -= (SHORE_Z + .8 - z) * .28;
  if (z > 8.7) h += Math.pow(z - 8.7, 1.3) * .5 + Math.sin(x * .8 + z) * .22 * clamp((z - 8.7) / 2, 0, 1);
  const f = clamp((z - (SHORE_Z + 1.2)) / 4, 0, 1), ex = Math.abs(x) - 4.7;
  if (ex > 0) h += (ex * ex * .16 + Math.sin(z * .9 + x) * .18 * clamp(ex / 2, 0, 1)) * f;
  return h;
}
const isGrass = (x, z) => (Math.abs(x) > 4.95 + Math.sin(z * .8) * .2 && z > SHORE_Z + 2.4) || z > 9.3;

/* ---------- curved world: far geometry bends away so the horizon and moon show at the top ---------- */
const CURVE = { z0: { value: SHORE_Z - 1.2 }, k: { value: .045 } };
const curveY = (z) => { const c = Math.max(0, CURVE.z0.value - z); return -c * c * CURVE.k.value; };
const timeU = { value: 0 };
function curved(mat, key = 'c', extra) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uCz = CURVE.z0; sh.uniforms.uCk = CURVE.k; sh.uniforms.uTime = timeU;
    sh.vertexShader = 'uniform float uCz; uniform float uCk; uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>',
      `vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_INSTANCING
  mvPosition = instanceMatrix * mvPosition;
#endif
vec4 wPos = modelMatrix * mvPosition;
${extra || ''}
float cz = max(0.0, uCz - wPos.z); wPos.y -= cz * cz * uCk;
mvPosition = viewMatrix * wPos;
gl_Position = projectionMatrix * mvPosition;`);
  };
  mat.customProgramCacheKey = () => 'curve-' + key;
  return mat;
}

/* ---------- audio: master bus with compressor + generated reverb, solemn pad score ---------- */
let AC = null, MG = null, REV = null, musicG = null, muted = false, audioOn = false;
try { muted = localStorage.getItem('sr_mute') === '1'; } catch (e) {}
function au() {
  if (!AC) {
    try { AC = new (self.AudioContext || self.webkitAudioContext)(); } catch (e) { return; }
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(AC.destination);
    MG = AC.createGain(); MG.gain.value = muted ? 0 : .9; MG.connect(comp);
    const len = AC.sampleRate * 2.6, ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const a = ir.getChannelData(ch); for (let i = 0; i < len; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const cv = AC.createConvolver(); cv.buffer = ir; REV = AC.createGain(); REV.gain.value = .32; REV.connect(cv); cv.connect(MG);
    musicG = AC.createGain(); musicG.gain.value = 1; musicG.connect(MG); musicG.connect(REV);
  }
  if (AC.state === 'suspended') AC.resume();
  if (!audioOn) { audioOn = true; startAmbience(); startMusic(); setRain(!!LK.rain); }
}
function setMuted(m) { muted = m; try { localStorage.setItem('sr_mute', m ? '1' : '0'); } catch (e) {} if (MG) MG.gain.setTargetAtTime(m ? 0 : .9, AC.currentTime, .05); }
function tone(f, d, type = 'sine', v = .15, to, delay = 0, rev = .25, dest) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(dest || MG); if (rev && !dest) { const s = AC.createGain(); s.gain.value = rev; g.connect(s); s.connect(REV); }
  o.start(t); o.stop(t + d + .05);
}
let NB = null;
function noise(d, v = .12, f = 800, delay = 0, q = 1, type = 'bandpass', rev = .1) {
  if (!AC) return; if (!NB) { NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = NB; s.playbackRate.value = rnd(.9, 1.1);
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = AC.createGain();
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(MG); if (rev) { const r = AC.createGain(); r.gain.value = rev; g.connect(r); r.connect(REV); }
  s.start(t, Math.random()); s.stop(t + d + .05);
}
let rainG = null;
function setRain(on) {
  if (!AC) return;
  if (!rainG) {
    const len = AC.sampleRate * 3, b = AC.createBuffer(1, len, AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < len; i++) a[i] = Math.random() * 2 - 1;
    const s = AC.createBufferSource(); s.buffer = b; s.loop = true; const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    rainG = AC.createGain(); rainG.gain.value = 0; s.connect(hp).connect(lp).connect(rainG).connect(MG); s.start();
  }
  rainG.gain.setTargetAtTime(on ? .075 : 0, AC.currentTime, .6);
}
function startAmbience() {
  const len = AC.sampleRate * 4, b = AC.createBuffer(1, len, AC.sampleRate), a = b.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { last = last * .985 + (Math.random() * 2 - 1) * .015; a[i] = last * 5; }
  const s = AC.createBufferSource(); s.buffer = b; s.loop = true; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  const g = AC.createGain(); g.gain.value = .07; const lfo = AC.createOscillator(); lfo.frequency.value = .12; const lg = AC.createGain(); lg.gain.value = .05;
  lfo.connect(lg).connect(g.gain); s.connect(lp).connect(g).connect(MG); s.start(); lfo.start();
  setInterval(() => { if (!AC || document.hidden) return; if (Math.random() < .45) for (let i = 0; i < 3; i++) tone(4300 + Math.random() * 250, .025, 'sine', .008, 0, i * .08, 0); }, 1900);
}
const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [[45, 52, 55, 59, 60], [41, 48, 52, 57, 64], [48, 55, 62, 64, 67], [43, 50, 59, 62, 64]];
const MEL = [69, 72, 74, 76, 79, 81];
let musicStep = 0, musicNext = 0, musicMood = 0;    // mood: 0 calm, 1 tense (gull), 2 last one
function startMusic() {
  musicNext = AC.currentTime + .3;
  setInterval(() => {
    if (!AC || document.hidden) return;
    while (musicNext < AC.currentTime + .6) { playChord(CHORDS[musicStep % CHORDS.length], musicNext); musicStep++; musicNext += 5.6; }
  }, 200);
}
function playChord(ch, t) {
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = musicMood === 2 ? 1500 : 850; lp.connect(musicG);
  for (const n of ch) for (const det of [-5, 5]) {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = midi(n); o.detune.value = det;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.017, t + 1.9); g.gain.setValueAtTime(.017, t + 4.6); g.gain.linearRampToValueAtTime(.0001, t + 7.6);
    o.connect(g).connect(lp); o.start(t); o.stop(t + 7.8);
  }
  const plucks = 1 + ((Math.random() * 2) | 0);

/* ---------- level map: a sand trail up the coast, level 1 at the bottom ---------- */
function showMap() {

  let path = `M${px(0)} ${py(0) + 60}L${px(0)} ${py(0)}`; for (let i = 1; i < N; i++) { const cx = (px(i - 1) + px(i)) / 2; path += ` Q${px(i - 1)} ${(py(i - 1) + py(i)) / 2} ${cx} ${(py(i - 1) + py(i)) / 2} T${px(i)} ${py(i)}`; }
  let nodes = '';
  const lockI = '<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3" fill="#a9b8d6" stroke="#16243b" stroke-width="1.8"/><path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="#a9b8d6" stroke-width="2.6"/></svg>';
  for (let i = 0; i < N; i++) {

    if (i % 10 === 0) nodes += `<div class="chap" style="top:${py(i) + 56}px"><small>Chapter ${i / 10 + 1}</small>${chapterOf(i)}</div>`;
    nodes += `<button class="node ${st}${big ? ' big boss' : boss ? ' boss' : ''}" data-i="${i}" style="left:${px(i) - 32}px;top:${py(i) - 32}px">${st === 'lock' ? lockI : `<span>${i + 1}</span>`}${(big || boss) && st !== 'cur' ? `<i class="crown">${ICON.crown}</i>` : ''}${st === 'cur' ? `<i class="me">${ICON.turtle()}</i>` : ''}<em>${st === 'done' ? [0, 1, 2].map((s) => `<i class="${s < b ? 'on' : ''}"></i>`).join('') : ''}</em></button>`;
  }

    <div class="scroller"><div class="track" style="width:${Wd}px;height:${Ht}px"><svg width="${Wd}" height="${Ht}" viewBox="0 0 ${Wd} ${Ht}"><path d="${path}" fill="none" stroke="#16243b" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="#e9cf98" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="#d4b276" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16" transform="translate(-7 0)"/><path d="${path}" fill="none" stroke="#d4b276" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16" stroke-dashoffset="9" transform="translate(7 0)"/></svg>${nodes}</div></div>
    <div class="mapbot"><button class="b-gold sq" id="mshop" aria-label="Shop">${ICON.shop}</button><button class="b-green hero" id="mplay">${ICON.play}Level ${cur + 1}</button><button class="b-coral sq" id="mcrew" aria-label="Crew">${ICON.turtle('#fff4d6', '#e8a08e')}</button></div>`;
  $('#app').appendChild(v);
  const sc = v.querySelector('.scroller'); sc.scrollTop = Math.max(0, py(cur) - sc.clientHeight * .58);
  const startAt = (i) => { au(); v.remove(); $('#app').classList.add('playing'); begin(i); running = true; ui.night(); };
  v.querySelectorAll('.node').forEach((n) => { n.onclick = () => { const i = +n.dataset.i; if (i <= cur) startAt(i); else { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); sfx.uhoh && sfx.uhoh(); buzz(20); } }; });
  v.querySelector('#mplay').onclick = () => startAt(cur);

}

/* ---------- loop + boot ---------- */
let last = 0, booted = false, started = false, lastRaw = 0;
const TS = clamp(+(Q.get('ts') || 1) | 0, 1, 8);   // test-only time scale for bots
function loop(ts) {
  const raw = Math.min(.05, (ts - last) / 1000 || 0); last = ts; lastRaw = raw;
  if (slowT > 0) { slowT -= raw; if (slowT <= 0) slow = 1; }
  let dt = raw * (lastOne ? .62 : 1) * slow;
  if (freeze > 0) { freeze -= raw; dt = 0; }
  if (capT > 0 && capT < 90 && (capT -= raw) <= 0) ui.capOff();
  if (capT >= 90 && !hand && !T.some((t) => t.st === 'flip' || t.st === 'carried' || t.st === 'tangle') && !gulls.some((g) => g.st === 'dive')) capT = 1.2;

$('#hmap i').innerHTML = ICON.map.replace('currentColor', '#fff4d6'); $('#hcrew i').innerHTML = ICON.turtle('#fff4d6', '#e8a08e'); $('#hshop i').innerHTML = ICON.shop; $('#gear').innerHTML = ICON.gear;
(function title() {

  if (PROG.lastDay !== today) { PROG.streak = PROG.lastDay === y ? PROG.streak + 1 : 1; PROG.lastDay = today; PROG.boosts += 1; PROG.gift = 1; saveProg(); } else PROG.gift = 0;
  $('#tagstats').innerHTML = `<span class="chip">${ICON.flame}Day ${PROG.streak}</span>${PROG.saved ? `<span class="chip">${ICON.turtle()}${PROG.saved} guided home</span>` : ''}${PROG.gift ? `<span class="chip gift">${ICON.gift}+1 boost</span>` : ''}`;
})();
const n0 = Q.has('n') ? Math.max(0, +Q.get('n') | 0) : 0;
if (Q.has('n')) { begin(n0); running = false; } else { attract = true; begin(-1); running = true; }
requestAnimationFrame(loop);

  forceEnd: (s, l) => { safeN = s; lostN = l; running = false; ended = true; endNight(); }, showCrew: () => showCrew(), showSettings: () => showSettings(), pause: () => ui.pause(),
  dolGo: () => { dol.next = 0; },
  get T() { return T; }, get litter() { return litter; }, get balls() { return balls; }, get rocks() { return rocks; }, get crabs() { return crabs; }, get gulls() { return gulls; }, get logs() { return logs; }, get tourists() { return tourists; },
  tap, scr, groundAt, surfaceTap, get running() { return running; }, get night() { return night; }, get safe() { return safeN; }, get lost() { return lostN; }, get total() { return total; }, get binned() { return binnedN; },
  get season() { return season; }, get carry() { return carry; }, get surf() { return surfLog; }, get bin() { return bin; }, get shoreZ() { return SHORE_Z; }, time: () => time,
