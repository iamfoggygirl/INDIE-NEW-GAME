<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12203A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Shell Run</title>
<style>
:root{color-scheme:dark;--navy:#12203A;--frame:#1d3157;--frame2:#29426f;--cream:#fbf1d8;--cream2:#f3e3bf;--ink:#1b2433;--muted:#6a7186;--green:#7DB05A;--green2:#4f7d36;--teal:#6fd1c8;--teal2:#3d9e96;--gold:#E0B040;--coral:#E8664A;--red:#D93A3A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0b1428;overflow:hidden;font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;margin:0 auto;height:100%;max-width:560px;overflow:hidden;background:#12203A}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov2{z-index:2}
.hud{opacity:0;transition:opacity .4s;position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;z-index:5}
.pill{background:rgba(18,32,58,.82);border:2px solid rgba(255,243,196,.18);border-radius:999px;padding:5px 12px 5px 7px;font-weight:900;font-size:18px;color:var(--cream);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill svg{width:28px;height:28px;flex:none}
.pill .sub{font-size:13px;opacity:.7}
.pill.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.18)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#app.playing .hud{opacity:1}
#lostP{opacity:0;transform:scale(.6);transition:.3s cubic-bezier(.2,1.6,.4,1);gap:1px;padding:6px 9px}
#lostP.on{opacity:1;transform:none}
#lostP .ht{display:inline-flex;width:19px;height:19px}
#lostP .ht svg{width:100%;height:100%}
#lostP .ht.brk{animation:hbrk .7s ease-out}
#lostP.last .ht:not(.gone){animation:hbeat 1.1s infinite}
@keyframes hbrk{0%{transform:scale(1.6) rotate(-12deg);filter:brightness(2)}40%{transform:scale(.7) rotate(14deg)}100%{transform:none}}
@keyframes hbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.dangerV{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 80px 8px rgba(232,102,74,.6)}
.dangerV.on{opacity:1;animation:dng 1.15s infinite}
@keyframes dng{0%,100%{opacity:.35}15%{opacity:1}45%{opacity:.6}}
.ribbon .new.tag{background:#6a4bd8}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,243,196,.18);background:rgba(18,32,58,.82);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.iconbtn svg{width:26px;height:26px}
.iconbtn:active{transform:scale(.92)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#banner{position:absolute;left:0;right:0;top:calc(108px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none;z-index:5;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s}
#banner.on{opacity:1;transform:none}
.ribbon{position:relative;background:var(--gold);color:#4a2f00;font-weight:900;font-size:21px;padding:8px 26px;border-radius:10px;box-shadow:0 4px 0 #a87b1c,0 10px 24px rgba(0,0,0,.35);text-wrap:balance;text-align:center;max-width:300px}
.ribbon.coral{background:var(--coral);color:#fff7ee;box-shadow:0 4px 0 #a8432d,0 10px 24px rgba(0,0,0,.35)}
.ribbon small{display:block;font-size:12px;letter-spacing:.12em;opacity:.75}.ribbon .place{display:block;font-size:11px;font-style:normal;font-weight:800;letter-spacing:.05em;opacity:.7;margin-top:1px}
#cap{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:23px;font-weight:900;color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;z-index:5;padding:0 16px;text-wrap:balance}
#cap.on{opacity:1;transform:none}
.veil{position:absolute;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;z-index:10;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{position:relative;margin-top:74px;background:var(--frame);border-radius:30px;padding:10px;width:100%;max-width:350px;box-shadow:0 8px 0 #0d1830,0 26px 50px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(24px);opacity:0}}
.inner{background:var(--cream);border-radius:22px;padding:44px 16px 16px;text-align:center}
.card .ribbon{position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;font-size:22px}
.stars{position:absolute;left:0;right:0;top:-104px;display:flex;justify-content:center;align-items:flex-end;gap:2px;pointer-events:none}
.stars svg{width:56px;height:56px;transform:scale(.4);opacity:.0;transition:.45s cubic-bezier(.2,1.8,.4,1);filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.stars svg:nth-child(2){width:68px;height:68px;margin-bottom:10px}
.stars svg.show{opacity:1;transform:scale(1)}
.big{font-size:54px;font-weight:900;line-height:1;margin:2px 0 0;font-variant-numeric:tabular-nums;color:var(--ink)}
.big span{font-size:26px;color:var(--muted)}
.lbl{display:flex;justify-content:center;align-items:center;gap:6px;font-weight:800;color:#5a6178;font-size:15px;margin-top:2px}
.lbl svg{width:22px;height:22px}
.crew{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:10px auto 8px;max-width:290px}
.crew b{width:13px;height:11px;border-radius:50% 50% 45% 45%;background:var(--green);box-shadow:inset 0 -2px 0 var(--green2)}
.crew b.g{background:var(--gold);box-shadow:inset 0 -2px 0 #a87b1c}
.crew b.x{background:#d8ccb2;box-shadow:none;opacity:.8}
.row{display:flex;align-items:center;gap:8px;background:var(--cream2);border-radius:14px;padding:7px 10px;margin:6px 0;font-weight:800;font-size:14px;color:#4b5268;text-align:left}
.row svg{width:26px;height:26px;flex:none}
.bar{flex:1;height:10px;border-radius:99px;background:#ddcfae;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--teal2);border-radius:99px;transition:width .8s cubic-bezier(.2,1,.3,1)}
.fact{font-size:13.5px;line-height:1.35;color:#4b5268;font-weight:700;margin:8px 4px 10px;text-wrap:pretty}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:6px}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;min-height:54px;font-weight:900;font-size:19px;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button svg{width:24px;height:24px}
.b-green{background:var(--green);color:#16300a;box-shadow:0 5px 0 var(--green2),inset 0 2px 0 rgba(255,255,255,.35)}
.b-teal{background:var(--teal);color:#0d3a36;box-shadow:0 5px 0 var(--teal2),inset 0 2px 0 rgba(255,255,255,.35);font-size:16px}
.b-navy{background:var(--frame2);color:var(--cream);box-shadow:0 5px 0 #0d1830;font-size:16px;min-height:46px}
button:disabled{opacity:.6}
#start{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(15vh + env(safe-area-inset-top,0px)) 20px calc(44px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(8,14,28,.35),transparent 35%,transparent 60%,rgba(8,14,28,.6))}
#start h1{margin:0;text-align:center;color:var(--cream);font-size:64px;line-height:.95;letter-spacing:-.02em;text-shadow:0 5px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.4)}
#start h1 svg{display:block;margin:0 auto 6px;width:84px;height:84px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
#start button{width:100%;max-width:330px;min-height:66px;font-size:24px}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--cream);font-weight:900;z-index:20;background:#12203A;font-size:20px}
.adbox{height:170px;border-radius:16px;background:linear-gradient(135deg,#2f8be0,#6fd1c8);display:grid;place-items:center;margin:6px 0 12px}.adbox svg{width:72px;height:72px}
.map{position:absolute;inset:0;z-index:11;display:flex;flex-direction:column;background:linear-gradient(#0b1b3a,#16315e 45%,#1f5a73 80%,#2a7c86)}
.maptop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;z-index:2}
.maptitle{color:var(--cream);font-weight:900;font-size:22px;letter-spacing:-.01em}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}.scroller *{touch-action:pan-y}
.track{position:relative;margin:0 auto}.track svg{position:absolute;inset:0}
.node{position:absolute;width:62px;height:62px;min-height:0;padding:0;border-radius:50%;font-size:24px;display:grid;place-items:center;color:#fff}
.node span{grid-area:1/1}.node svg{grid-area:1/1;position:static;width:26px;height:26px}
.node em{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);display:flex;gap:1px}
.node em i{width:15px;height:15px;background:#3a4f78;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}.node em i.on{background:var(--gold)}
.node.done{background:var(--green);box-shadow:0 5px 0 var(--green2),inset 0 2px 0 rgba(255,255,255,.35);color:#16300a}
.node.cur{background:var(--gold);color:#4a2f00;box-shadow:0 5px 0 #a87b1c,0 0 0 6px rgba(224,176,64,.3);animation:pulse 1.4s infinite}
.node.lock{background:#2c3d63;box-shadow:0 5px 0 #1a2845;color:#8a93a8}
.node.big{width:74px;height:74px;margin:-6px 0 0 -6px;background:var(--coral);box-shadow:0 5px 0 #a8432d}.node.big.lock{background:#4a3550}
.node.shake{animation:shk .3s}
@keyframes pulse{50%{transform:scale(1.1)}}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chap{position:absolute;left:0;right:0;text-align:center;color:var(--cream);font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.mapbot{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(8,14,28,.7))}.mapbot button{width:100%;min-height:62px;font-size:22px}
.ribbon .new{display:block;margin-top:5px;font-size:12px;letter-spacing:.04em;font-weight:900;background:rgba(74,47,0,.18);border-radius:99px;padding:3px 10px;white-space:normal}
#start{transition:opacity .45s}#start.out{opacity:0;pointer-events:none}
#start h1{animation:floaty 3.2s ease-in-out infinite}#start h1 svg{animation:bob 2.2s ease-in-out infinite}
#start .lore{color:var(--cream);font-weight:700;font-size:13px;font-style:italic;opacity:.7;margin:8px 22px 0;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.65),0 0 12px rgba(0,0,0,.7)}
#start .tag{color:var(--cream);font-weight:800;font-size:18px;opacity:.88;margin-top:12px;text-shadow:0 2px 0 rgba(0,0,0,.65),0 0 14px rgba(0,0,0,.7);text-align:center}
#start button{animation:pulseBtn 1.8s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}@keyframes pulseBtn{50%{transform:scale(1.04)}}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
#power{position:absolute;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:68px;height:68px;min-height:0;border-radius:50%;padding:0;z-index:6;display:none;border:0;background:conic-gradient(var(--gold) calc(var(--p,0) * 1%),rgba(18,32,58,.85) 0);box-shadow:0 4px 0 rgba(0,0,0,.3)}
#power .in{position:absolute;inset:6px;border-radius:50%;background:#1d3157;display:grid;place-items:center}#power .in svg{width:34px;height:34px}
#power.on{display:block}#app:not(.playing) #power{display:none}#power.ready{animation:pulseBtn .9s ease-in-out infinite;box-shadow:0 0 0 5px rgba(224,176,64,.35),0 4px 0 rgba(0,0,0,.3)}
#power .cnt{position:absolute;right:-5px;top:-5px;background:var(--coral);color:#fff;border-radius:99px;font-size:13px;font-weight:900;min-width:24px;height:24px;display:none;place-items:center;padding:0 5px;border:2px solid #12203A}
#toast{position:absolute;left:14px;right:14px;top:calc(116px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:10px;align-items:center;background:rgba(251,241,216,.96);color:var(--ink);border-radius:16px;padding:9px 12px;box-shadow:0 5px 0 rgba(0,0,0,.25);font-weight:800;font-size:13.5px;line-height:1.3;opacity:0;transform:translateY(-10px);transition:.35s;pointer-events:none}
#toast.on{opacity:1;transform:none}#toast svg{width:30px;height:30px;flex:none}#toast small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--green2);margin-bottom:1px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{display:flex;align-items:center;gap:5px;background:rgba(18,32,58,.72);border:2px solid rgba(255,243,196,.2);color:var(--cream);border-radius:99px;padding:3px 11px 3px 6px;font-weight:900;font-size:14px}.chip svg{width:20px;height:20px}.chip.gift{background:rgba(232,102,74,.9)}
.sm{min-height:40px;font-size:15px;padding:6px 16px;box-shadow:0 4px 0 var(--green2)}.sm:disabled{box-shadow:none}
.row.shop{align-items:center;padding:9px 10px;gap:10px}.row.shop svg{width:34px;height:34px}.row.shop b{display:block;font-size:15px;color:var(--ink)}
.tog{display:flex;gap:9px}.tog button{flex:1;font-size:14px;min-height:46px;padding:8px}
.mapbot{display:flex;gap:10px}.mapbot .b-navy{flex:none;width:66px;min-height:62px;padding:0}.mapbot .b-navy svg{width:30px;height:30px}
@media (prefers-reduced-motion: reduce){.card,.veil,.pill.bump{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv3"></canvas>
  <canvas id="ov2"></canvas>
  <div class="hud">
    <div class="left"><div class="pill" id="nightP"></div><button class="iconbtn" id="pauseB" aria-label="Pause"></button></div>
    <div class="mid">
      <div class="pill" id="safeP"></div>
      <div class="pill" id="lostP"></div>
    </div>
    <div class="right">
      <div class="pill" id="binP"></div>
      <button class="iconbtn" id="snd" aria-label="Sound on or off"></button>
    </div>
  </div>
  <div class="dangerV" id="dng"></div>
  <div id="banner"><div class="ribbon" id="bannerT"></div></div>
  <div id="cap"></div>
  <div id="toast"></div>
  <button id="power" aria-label="Boost"><div class="in" id="powerIn"></div><span class="cnt" id="powerCnt"></span></button>
  <div id="start"><div><h1 id="title">Shell Run</h1><div class="tag">Guide the hatchlings home</div><div class="lore">We can't control the turtles. We can clear what people left behind.</div><div class="stats" id="tagstats"></div></div><button class="b-green" id="go"></button></div>
  <div id="ov"></div>
  <div id="load">Loading the beach…</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

})();
</script>
</body>
</html>
