<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shell Run</title>
<style>
:root{--ink:#1b2433;--cream:#fff8ea;--gold:#ffd166;--bad:#ef6f6c;--muted:#5d6880}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0d1626;overflow:hidden;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;margin:0 auto;height:100%;max-width:560px;overflow:hidden;background:#24345e}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov2{z-index:2}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.pill{background:rgba(255,248,234,.94);border-radius:999px;padding:8px 14px;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:7px;white-space:nowrap}
.pill small{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.pill svg{width:22px;height:18px}
.pill.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
#lost{color:var(--bad)}
#cap{position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));text-align:center;font-size:24px;font-weight:900;color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .3s;z-index:5;padding:0 16px;text-wrap:balance}
#cap.on{opacity:1}
.veil{position:absolute;inset:0;background:rgba(8,14,28,.5);display:grid;place-items:center;z-index:10;padding:18px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:var(--cream);border-radius:28px;padding:22px 20px 20px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2),0 24px 50px rgba(0,0,0,.45);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
.card h2{margin:0;font-size:30px;line-height:1.05;text-wrap:balance}
.card .big{font-size:56px;font-weight:900;line-height:1;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.card .big span{font-size:24px;color:var(--muted)}
.card p{margin:6px 0 14px;color:#56607a;font-weight:700;text-wrap:balance}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0}
.stars i{font-style:normal;font-size:40px;filter:grayscale(1);opacity:.3;transform:scale(.6);transition:.35s cubic-bezier(.2,1.8,.4,1)}
.stars i.on{filter:none;opacity:1;transform:scale(1)}
.btns{display:flex;flex-direction:column;gap:10px}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;min-height:54px;font-weight:900;font-size:19px;padding:12px 22px;color:var(--ink)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.primary{background:linear-gradient(#ffd37a,#f5a524);color:#4a2a00;box-shadow:0 4px 0 #b9760f}
.ghost{background:#efe4cf}
.crew{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:8px auto 4px;max-width:270px}
.crew b{width:13px;height:11px;border-radius:50%;background:#3f8f5a;box-shadow:inset 0 -2px 0 #2c6b42}
.crew b.x{background:#cfc6b4;box-shadow:none}
.crew b.new{background:#8fd19e}
#start{position:absolute;inset:0;z-index:12;display:grid;place-items:end center;padding:0 18px calc(40px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(8,14,28,.2),transparent 30%,transparent 55%,rgba(8,14,28,.55))}
#start h1{position:absolute;top:16%;left:0;right:0;margin:0;text-align:center;color:var(--cream);font-size:56px;letter-spacing:-.02em;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.35)}
#start h1 small{display:block;font-size:16px;letter-spacing:.08em;font-weight:800;opacity:.9;margin-top:6px}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--cream);font-weight:900;z-index:20;background:#24345e}
@media (prefers-reduced-motion: reduce){.card,.veil,.pill.bump{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv3"></canvas>
  <canvas id="ov2"></canvas>
  <div class="hud">
    <div class="pill"><small id="night">Night 1</small></div>
    <div class="pill" id="safeP"><svg viewBox="0 0 22 18"><ellipse cx="11" cy="10" rx="8" ry="7" fill="#3f8f5a"/><circle cx="19" cy="9" r="3" fill="#7cc08a"/></svg><span id="safe">0</span>/<span id="total">0</span></div>
    <div class="pill" id="lostP" style="visibility:hidden"><span id="lost">0</span>&nbsp;lost</div>
  </div>
  <div id="cap"></div>
  <div id="start"><h1>Shell Run<small>GET THEM ALL TO THE SEA</small></h1><button class="primary" id="go" style="width:100%;max-width:340px">Tap to start</button></div>
  <div id="ov"></div>
  <div id="load">Loading the beach…</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

  log() { noise(.22, .16, 380); tone(200, .15, 'triangle', .08, 120); buzz(16); },
  safe(i) { noise(.25, .06, 1500); tone(note(i), .32, 'sine', .13); tone(note(i) * 2, .16, 'triangle', .035); buzz(8); },

  uhoh() { tone(392, .22, 'sine', .1, 300); buzz(35); },
  grab() { tone(700, .25, 'sawtooth', .07, 1300); noise(.15, .08, 3000); buzz([25, 25, 25]); },
  lost() { tone(330, .4, 'sine', .1, 220); tone(262, .5, 'sine', .08, 196, .25); buzz(70); },
  hey() { tone(260, .12, 'sawtooth', .07, 340); tone(340, .2, 'sawtooth', .07, 230, .1); buzz([10, 20, 30]); },
  flash() { noise(.05, .2, 5000, 0, .5); tone(2400, .04, 'square', .03); },
  combo(n) { [0, 2, 4].forEach((k, i) => tone(note(n + k + 5), .18, 'triangle', .1, 0, i * .05)); buzz([10, 15, 10, 15]); },

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#d9a0a4');

const cam = new THREE.PerspectiveCamera(30, 1, .5, 200);
const camAim = new THREE.Vector3(0, 0, -.2), camWant = new THREE.Vector3(), camPos = new THREE.Vector3();
let W = 1, H = 1, camDist = 40, zoom = 1, zoomTo = 1, focus = new THREE.Vector3(0, 0, -.2), focusTo = new THREE.Vector3(0, 0, -.2);
const ELEV = 56 * Math.PI / 180;

scene.add(new THREE.AmbientLight(0x4a5590, .18));

/* geometry helpers */
const MAT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .55, metalness: 0 });

const MATL = new THREE.MeshLambertMaterial({ vertexColors: true });

const CY = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
const BX = (x, y, z) => new THREE.BoxGeometry(x, y, z);

/* ================= ENVIRONMENT ================= */
const timeU = { value: 0 };
// ground: flat play beach, dunes behind, raised edges
function groundH(x, z) {
  let h = Math.sin(x * 1.3) * Math.cos(z * 1.1) * .03;
  if (z < -8.2) h += Math.pow(-8.2 - z, 1.35) * .42 + Math.sin(x * .7) * .25 * clamp((-8.2 - z) / 3, 0, 1);

palm(-5.4, -4.5, -1); palm(5.5, -1.8, 1); palm(-5.8, 2.6, -1); palm(5.7, 4.6, 1); palm(-5.3, -11, -.4); palm(4.6, -12, .5);
function bush(x, z, s) { const y = groundH(x, z); for (let k = 0; k < 5; k++) decoParts.push([S(.35 * s, 8, 6), ['#4d8a45', '#5f9c52', '#3f7a3c'][k % 3], M(x + rnd(-.4, .4) * s, y + .15 * s, z + rnd(-.3, .3) * s, 1, .8, 1)]); if (Math.random() < .6) decoParts.push([S(.08 * s, 6, 4), '#ff8fb1', M(x + rnd(-.3, .3), y + .45 * s, z)]); }
[[-5.3, -7.4, 1.2], [5.3, -6.6, 1], [-5.4, -1, .9], [5.2, 1.2, 1.1], [-5.1, 4.9, .8], [5.3, -4, 1], [-5.2, 1.4, .9], [-3.5, -9.2, 1.1], [3.2, -9.4, 1.3], [0.4, -10.2, 1]].forEach((b) => bush(...b));
(function hut() {

  for (const t of T) if (t.st === 'walk' && (t.stuck > .5 || t.lure > 0)) { const s = scr(t.x, .5, t.z); oc.fillStyle = '#fff'; oc.strokeStyle = 'rgba(0,0,0,.45)'; oc.lineWidth = 3 * k; const m = t.lure > 0 ? '✦' : '?'; oc.strokeText(m, s.x, s.y - 8 * k); oc.fillText(m, s.x, s.y - 8 * k); }
  // particles
  for (const p of fx) {
    const a = 1 - p.t / p.life;
    if (p.k === 'dot') { const s = scr(p.x, Math.max(0, p.y), p.z); oc.globalAlpha = a; oc.fillStyle = p.c; oc.beginPath(); oc.arc(s.x, s.y, p.r * k, 0, 6.3); oc.fill(); }
    else if (p.k === 'ring3') { const s = scr(p.x, 0, p.z); oc.globalAlpha = a; oc.strokeStyle = '#eaf7ff'; oc.lineWidth = 3 * k; oc.beginPath(); oc.ellipse(s.x, s.y, (8 + p.t * 40) * k, (3 + p.t * 15) * k, 0, 0, 6.3); oc.stroke(); }
    else if (p.k === 'tap') { oc.globalAlpha = a; oc.strokeStyle = p.c; oc.lineWidth = 3 * k; oc.beginPath(); oc.arc(p.sx, p.sy, (10 + p.t * 70) * k, 0, 6.3); oc.stroke(); }
    else if (p.k === 'flash') { const s = scr(p.x, 1.5, p.z); oc.globalAlpha = a * .9; const g = oc.createRadialGradient(s.x, s.y, 0, s.x, s.y, 140 * k); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)'); oc.fillStyle = g; oc.fillRect(s.x - 140 * k, s.y - 140 * k, 280 * k, 280 * k); }
  }
  oc.globalAlpha = 1;
  // floating text
  oc.font = `900 ${21 * k}px ui-rounded,system-ui,sans-serif`;
  for (const f of floats) { oc.globalAlpha = 1 - f.t / 1.1; const y = f.y - f.t * 46 * k; oc.fillStyle = '#fff'; oc.strokeStyle = 'rgba(0,0,0,.45)'; oc.lineWidth = 4 * k; oc.strokeText(f.s, f.x, y); oc.fillText(f.s, f.x, y); }
  oc.globalAlpha = 1;
  if (comboFx) { const p = comboFx.t, sc = 1 + Math.max(0, .4 - p) * 1.5; oc.save(); oc.translate(W / 2, H * .3); oc.scale(sc, sc); oc.globalAlpha = Math.min(1, 1.6 - p); oc.font = `900 ${34 * k}px ui-rounded,system-ui,sans-serif`; oc.fillStyle = '#ffd166'; oc.strokeStyle = 'rgba(60,30,0,.6)'; oc.lineWidth = 6 * k; const s = comboFx.n + ' saves in a row!'; oc.strokeText(s, 0, 0); oc.fillText(s, 0, 0); oc.restore(); }
  // teaching hand
  if (hand) { const o = hand.o; const s = scr(o.x, hand.y, o.z); const b = Math.sin(time * 6) * 6 * k; oc.save(); oc.translate(s.x + 12 * k, s.y + 12 * k + b); oc.strokeStyle = 'rgba(255,255,255,.85)'; oc.lineWidth = 3 * k; oc.beginPath(); oc.arc(-12 * k, -12 * k, (12 + (time * 30 % 20)) * k, 0, 6.3); oc.stroke(); oc.fillStyle = '#fff'; oc.strokeStyle = '#1b2433'; oc.lineWidth = 2.5 * k; oc.beginPath(); oc.roundRect(-5 * k, -14 * k, 10 * k, 30 * k, 5 * k); oc.roundRect(-5 * k, 6 * k, 24 * k, 24 * k, 9 * k); oc.fill(); oc.stroke(); oc.restore(); }
  // vignette for the last-one moment
  if (zoom < .98) { const a = (1 - zoom) * 1.6; const g = oc.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(5,10,25,${a})`); oc.fillStyle = g; oc.fillRect(0, 0, W, H); }
}

/* ================= CAMERA + LOOP ================= */
function placeCam(dt) {
  zoom = lerp(zoom, zoomTo, 1 - Math.exp(-dt * 2.5)); focus.lerp(focusTo, 1 - Math.exp(-dt * 2.5));
  const dist = camDist * zoom; camPos.set(focus.x, focus.y + Math.sin(ELEV) * dist, focus.z + Math.cos(ELEV) * dist);
  if (shake > .005 && !REDUCE) { camPos.x += rnd(-shake, shake); camPos.y += rnd(-shake, shake); shake *= .86; }
  cam.position.copy(camPos); cam.lookAt(focus);
}
let last = 0, booted = false;
function loop(ts) {
  const raw = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (slowT > 0) { slowT -= raw; if (slowT <= 0) slow = 1; }
  const tScale = (lastOne ? .62 : 1) * slow; let dt = raw * tScale;
  if (freeze > 0) { freeze -= raw; dt = 0; }
  if (running || T.length) update(dt); else { time += raw; timeU.value += raw; }
  updateSea(time); sync(); placeCam(raw); R.render(scene, cam); overlay();
  if (!booted) { booted = true; $('#load').remove(); }
  requestAnimationFrame(loop);
}

/* ================= END OF NIGHT ================= */
let rewardUsed = false;
function endNight() {
  const L = NIGHTS[night], pct = safeN / total, stars = safeN === total ? 3 : pct >= .8 ? 2 : 1, last = night === NIGHTS.length - 1, next = NIGHTS[night + 1];
  if (safeN === total) sfx.win(); else sfx.safe(0);
  const dots = Array.from({ length: total }, (_, i) => `<b class="${i < safeN ? (i >= crew ? 'new' : '') : 'x'}"></b>`).join('');
  const v = document.createElement('div'); v.className = 'veil';
  const head = safeN === total ? 'Every single one!' : safeN >= total - 2 ? 'So close!' : pct >= .5 ? 'Most made it' : 'A hard night';
  const line = last ? `Season over. ${safeN} of the ${seasonFresh} hatchlings you met made it all the way.` : `Tomorrow your ${safeN} lead the way, and ${next.fresh} new hatchlings join them.`;
  v.innerHTML = `<div class="card"><h2>${last && safeN === total ? 'A perfect season!' : head}</h2><div class="stars"><i>⭐</i><i>⭐</i><i>⭐</i></div>
    <div class="big">${safeN}<span> / ${total}</span></div><p>reached the sea</p><div class="crew">${dots}</div><p>${line}</p>
    <div class="btns">${lostN > 0 && !rewardUsed ? `<button class="ghost" id="bring">Bring back ${Math.min(3, lostN)} · watch a short video</button>` : ''}
    <button class="primary" id="next">${last ? 'New season' : 'Next night'}</button><button class="ghost" id="retry">Try this night again</button></div></div>`;
  $('#ov').appendChild(v);
  v.querySelectorAll('.stars i').forEach((s, i) => { if (i < stars) setTimeout(() => { s.classList.add('on'); tone(note(4 + i * 2), .3, 'triangle', .14); buzz(14); }, 300 + i * 280); });
  const back = Math.min(3, lostN), b = $('#bring');
  if (b) b.onclick = () => { b.disabled = true; let n = 3; b.textContent = 'Demo ad · ' + n; const iv = setInterval(() => { n--; if (n > 0) b.textContent = 'Demo ad · ' + n; else { clearInterval(iv); rewardUsed = true; safeN += back; lostN -= back; v.remove(); endNight(); } }, 1000); };
  $('#next').onclick = () => { v.remove(); rewardUsed = false; if (last) { crew = 0; seasonFresh = 0; startNight(0); } else { crew = safeN; startNight(night + 1); } };
  $('#retry').onclick = () => { v.remove(); rewardUsed = false; seasonFresh -= L.fresh; startNight(night); };
}

/* ================= BOOT ================= */
resize(); placeCam(1); requestAnimationFrame(loop);
$('#go').onclick = () => { au(); $('#start').remove(); crew = 0; seasonFresh = 0; startNight(Q.has('n') ? +Q.get('n') : 0); };
self.G = { get T() { return T; }, get rocks() { return rocks; }, get crabs() { return crabs; }, get gulls() { return gulls; }, get logs() { return logs; }, get tourists() { return tourists; }, tap, scr, get running() { return running; }, get night() { return night; }, get safe() { return safeN; }, get lost() { return lostN; }, get total() { return total; } };
})();
</script>
