<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffe7b8">
<title>Harvest Sow</title>
<style>
:root{
  --sky1:#ffe9bd;--sky2:#d6ecd8;--cream:#fff6e4;--ink:#3b2a1d;--ink2:#7a604a;
  --soil:#6b4226;--soil2:#8f5d36;--seed:#f7c948;--seed2:#d99a2b;
  --crow:#2a2c4a;--crow2:#4d507f;--barn:#c8553d;--barn2:#9e3d2b;--leaf:#6aa84f;--coin:#ffd24a;--good:#4caf7a;--warn:#e0703a;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#2b2118;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:relative;margin:0 auto;height:100dvh;max-width:480px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.96)}
.pill{background:var(--cream);border-radius:999px;padding:12px 20px;min-height:48px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.14),0 8px 18px rgba(80,50,20,.18)}
.pill.primary{background:linear-gradient(#ffc94d,#f2a21f);color:#4a2c08;font-size:20px;min-height:56px;padding:14px 30px;box-shadow:0 4px 0 #b9760f,0 10px 22px rgba(120,70,10,.3)}
.pill.ghost{background:rgba(255,246,228,.7);box-shadow:none;font-weight:700}
/* ---------- field ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.icon{width:46px;height:46px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.14);display:grid;place-items:center;flex:none}
.goal{flex:1;background:var(--cream);border-radius:999px;padding:6px 14px 8px;box-shadow:0 3px 0 rgba(0,0,0,.14);min-width:0}
.goal .row{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px}
.goal .row svg{width:22px;height:22px}
.gbar{height:9px;background:#ead7b5;border-radius:9px;margin-top:3px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd24a,#f29c1f);border-radius:9px;transition:width .25s}
.gbar.full i{box-shadow:0 0 12px #ffcf3a}
.moves{display:flex;gap:4px;align-items:center;background:var(--cream);border-radius:999px;padding:0 12px;height:46px;box-shadow:0 3px 0 rgba(0,0,0,.14);flex:none}
.moves b{font-size:13px;margin-right:2px;color:var(--ink2)}
.pip{width:11px;height:11px;border-radius:50%;background:var(--seed);box-shadow:inset 0 -2px 0 var(--seed2);transition:transform .2s,opacity .2s}
.pip.off{background:#e2d2b5;box-shadow:none;transform:scale(.7)}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;perspective:1100px;padding:4px 10px}
#board{position:relative;width:100%;height:100%;max-height:640px;transform:rotateX(11deg);transform-origin:50% 60%}
.tray{position:absolute;inset:2% 3%;border-radius:34px;background:
  radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.18),transparent 55%),
  repeating-linear-gradient(95deg,#a8703f 0 14px,#9b6637 14px 17px,#b07846 17px 31px);
  box-shadow:0 14px 0 #6c4122,0 26px 34px rgba(60,30,10,.38),inset 0 0 0 5px #c8915b,inset 0 0 0 9px #7c4c28}
.lane{position:absolute;left:12%;right:12%;top:8%;bottom:8%;border-radius:30px;background:linear-gradient(90deg,rgba(70,160,90,.22),rgba(70,160,90,.04) 40%,rgba(40,40,80,.04) 60%,rgba(40,40,90,.26));pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center}
.mound{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 30%,#a8714a,var(--soil) 62%,#4b2c16);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #4a2a14,0 9px 12px rgba(0,0,0,.28);transition:transform .12s}
.crow-plot .mound{background:radial-gradient(circle at 38% 30%,#6b6d9d,var(--crow2) 55%,#1f2038);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),0 5px 0 #17182c,0 9px 12px rgba(0,0,0,.35)}
.seeds{position:absolute;inset:0;pointer-events:none}
.sd{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--seed) 45%,var(--seed2));box-shadow:0 2px 0 rgba(0,0,0,.28)}
.crow-plot .sd{background:radial-gradient(circle at 35% 30%,#fff3b0,#f0c850 45%,#c9902a)}
.cnt{position:absolute;right:-4px;bottom:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--cream);font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.2);color:var(--ink);padding:0 4px}
.crow-plot .cnt{background:#d9dbf5}
.slot.legal{cursor:pointer}
.slot.legal .mound{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #4a2a14,0 9px 12px rgba(0,0,0,.28),0 0 0 3px rgba(255,236,150,.0)}
.slot.breathe .mound{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.slot.hint .mound{animation:hintp .9s ease-in-out infinite;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #4a2a14,0 0 0 4px #ffe58a,0 0 24px 8px rgba(255,214,90,.75)}
@keyframes hintp{50%{transform:scale(1.1)}}
.slot.lift .mound{transform:scale(1.18) translateY(-6px)}
.slot.pulse .mound{animation:pulse .26s ease-out}
@keyframes pulse{0%{transform:scale(.86,.8)}55%{transform:scale(1.12,1.1)}100%{transform:scale(1)}}
.slot.shake{animation:shake .3s}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
.slot.gold .mound{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #4a2a14,0 0 0 4px #ffd24a,0 0 18px 4px rgba(255,200,60,.6)}
.gold-tag{position:absolute;top:-10px;left:-8px;font-size:11px;font-weight:900;background:#ffd24a;color:#6a4300;border-radius:8px;padding:1px 5px;box-shadow:0 2px 0 #b98400}
.rock{position:absolute;inset:-4%}
.fence{position:absolute;inset:-6%;border-radius:50%;display:grid;place-items:center;background:repeating-linear-gradient(90deg,rgba(122,78,40,.95) 0 8px,rgba(0,0,0,0) 8px 14px);border:3px solid #5c3818;color:#fff;font-weight:900}
.fence span{background:#5c3818;border-radius:10px;padding:1px 7px;font-size:13px}
.barn{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center}
.barn .bx{position:relative;width:100%;height:100%;border-radius:20px;background:linear-gradient(#d86a50,var(--barn) 55%,var(--barn2));box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 0 #6e2a1c,0 12px 16px rgba(0,0,0,.3);display:grid;place-items:center;transition:transform .12s}
.barn.crowb .bx{background:linear-gradient(#5b5e92,var(--crow2) 55%,var(--crow));box-shadow:inset 0 -6px 0 rgba(0,0,0,.3),0 6px 0 #14152a,0 12px 16px rgba(0,0,0,.35)}
.barn .bx:before{content:"";position:absolute;left:10%;right:10%;top:-9px;height:16px;background:inherit;clip-path:polygon(0 100%,50% 0,100% 100%);filter:brightness(.88)}
.barn .num{font-size:30px;font-weight:900;color:#fff6e4;text-shadow:0 3px 0 rgba(0,0,0,.28);line-height:1}
.barn .lbl{position:absolute;bottom:3px;font-size:10px;font-weight:800;letter-spacing:.08em;color:rgba(255,246,228,.8)}
.barn.pop .bx{animation:pulse .3s ease-out}
.barn.extra .bx:after{content:"";position:absolute;inset:-8px;border-radius:26px;border:4px solid #ffe58a;animation:ring .7s ease-out forwards}
@keyframes ring{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.35)}}
.flyseed{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--seed) 45%,var(--seed2));box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:20}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 12px rgba(255,200,60,.9);pointer-events:none;z-index:30;white-space:nowrap}
.float.bad{color:#ffd0c8;text-shadow:0 3px 0 rgba(90,10,10,.55)}
#crow{position:absolute;width:64px;height:64px;transform:translate(-50%,-62%);transition:left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:15}
#crow.hop{animation:hop .3s}
@keyframes hop{50%{translate:0 -14px}}
#hand{position:absolute;width:64px;height:72px;pointer-events:none;z-index:25;transform:translate(-30%,-8%);animation:handbob .9s ease-in-out infinite}
@keyframes handbob{50%{translate:0 -10px}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.dock{display:flex;align-items:center;justify-content:center;gap:10px;min-height:76px;padding:6px 14px 14px}
#caption{position:absolute;left:0;right:0;top:78px;text-align:center;font-size:26px;font-weight:900;color:var(--cream);text-shadow:0 3px 0 rgba(60,30,10,.55),0 0 18px rgba(60,30,10,.4);pointer-events:none;z-index:40;opacity:0;transition:opacity .3s}
#caption.on{opacity:1}
/* ---------- overlays ---------- */
.veil{position:absolute;inset:0;background:rgba(40,25,10,.48);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--cream);border-radius:28px;padding:22px 20px 20px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.14),0 24px 50px rgba(30,15,0,.4);animation:cardin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardin{from{transform:scale(.8) translateY(20px);opacity:0}}
.card h2{margin:0 0 4px;font-size:30px;line-height:1.05}
.card p{margin:6px 0 14px;color:var(--ink2);font-weight:700}
.card .btns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars svg{width:54px;height:54px;transform:scale(0)}
.stars svg.on{animation:starin .5s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.stars svg.dim{transform:scale(1);opacity:.35;filter:grayscale(1)}
.bar{height:12px;background:#ead7b5;border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd24a,#f29c1f)}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(59,42,29,.92);color:var(--cream);border-radius:999px;padding:10px 18px;font-weight:800;z-index:55;animation:toast 2.2s forwards;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;translate:0 -10px}10%,85%{opacity:1;translate:0 0}100%{opacity:0}}
/* ---------- valley ---------- */
#valley{background:linear-gradient(#ffe0a6 0%,#ffeccd 28%,#d3ebd6 29%)}
.vhud{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;z-index:3}
.coins{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:999px;padding:6px 16px 6px 8px;font-weight:900;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,var(--coin) 50%,#d99a14);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.2);display:inline-block}
.coins.bump{animation:pulse .25s}
.streak{margin-left:auto;background:var(--cream);border-radius:999px;padding:8px 12px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.14)}
#scene{position:relative;flex:1;min-height:0;overflow:hidden}
.sun{position:absolute;right:12%;top:3%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#fff6c4,#ffd86a 60%,#ffc23d);box-shadow:0 0 50px 18px rgba(255,214,90,.5)}
.hill{position:absolute;border-radius:50%}
.h1{left:-30%;right:-10%;top:26%;height:70%;background:#a7d3a1}
.h2{left:20%;right:-40%;top:38%;height:70%;background:#8fc78a}
.h3{left:-20%;right:-20%;top:56%;height:80%;background:#79b874}
.path{position:absolute;left:34%;top:62%;width:34%;height:46%;background:#e9cf9d;border-radius:46% 54% 30% 70%/30% 30% 70% 70%;transform:rotate(-6deg)}
.b{position:absolute;transform:translate(-50%,-100%);transition:filter .3s}
.b svg{display:block;width:100%;height:auto;overflow:visible}
.b.new{animation:buildin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes buildin{from{transform:translate(-50%,-100%) scale(0);}}
.b.ghost svg{filter:brightness(0) opacity(.28)}
.b.ghost{cursor:pointer}
.tag{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--cream);border-radius:999px;font-weight:900;font-size:14px;padding:3px 9px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;gap:5px;align-items:center}
.tag .coin{width:16px;height:16px}
#stall{position:absolute;left:70%;top:97%;width:40%;transform:translate(-50%,-100%)}
#stall svg{display:block;width:100%}
#stall.glow{animation:hintp 1s infinite}
#basketN{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--cream);border-radius:999px;font-weight:900;padding:3px 12px;box-shadow:0 2px 0 rgba(0,0,0,.2);white-space:nowrap}
#pipwrap{position:absolute;left:18%;top:96%;width:14%;transform:translateY(-100%);transition:left 6s linear}
#pipwrap svg{width:100%;display:block}
#pipbub{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--cream);border-radius:999px;font-weight:900;padding:3px 10px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;gap:4px;align-items:center;animation:handbob 1.2s infinite}
.vdock{padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px;z-index:3}
.nextb{background:var(--cream);border-radius:20px;padding:10px 14px;box-shadow:0 3px 0 rgba(0,0,0,.14);display:flex;align-items:center;gap:12px;text-align:left}
.nextb .nm{font-weight:900}
.nextb .bar{margin:4px 0 0}
.nextb .go{flex:none}
.sellrow{display:flex;gap:8px}
/* settings + debug */
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:800;border-bottom:1px solid #ead7b5}
.tog{width:52px;height:30px;border-radius:15px;background:#d9c7a6;position:relative;transition:.2s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tog.on{background:var(--good)}.tog.on:after{left:25px}
pre.log{max-height:240px;overflow:auto;text-align:left;font-size:11px;background:#2b2118;color:#cfe;border-radius:12px;padding:8px;user-select:text;-webkit-user-select:text}
.ad{background:#fff;color:#222}
.ad .fake{height:120px;border-radius:14px;background:repeating-linear-gradient(45deg,#e4e4e4 0 12px,#f1f1f1 12px 24px);display:grid;place-items:center;font-weight:900;color:#888;margin:8px 0}
.adx{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#00000022;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div id="app">
  <!-- ======== FIELD ======== -->
  <section id="field" class="screen hidden">
    <header class="hud">
      <button class="icon" id="btnHome" aria-label="Valley"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 12 12 4l9 8v8h-6v-5H9v5H3z" fill="#c8553d"/></svg></button>
      <div class="goal" id="goalBox">
        <div class="row"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="8" ry="9" fill="#f7c948"/><ellipse cx="9" cy="9" rx="2.5" ry="3" fill="#fff3b0"/></svg><span><span id="goalCur">0</span> / <span id="goalNum">0</span></span></div>
        <div class="gbar" id="gbar"><i id="gfill"></i></div>
      </div>
      <div class="moves" id="moves" aria-label="Moves left"></div>
    </header>
    <div id="stage"><div id="board"></div></div>
    <div id="caption"></div>
    <footer class="dock">
      <button class="pill ghost hidden" id="btnUndo">↶ Undo</button>
      <button class="pill hidden" id="btnHint">Show a move</button>
    </footer>
  </section>

  <!-- ======== VALLEY ======== -->
  <section id="valley" class="screen hidden">
    <header class="vhud">
      <div class="coins" id="coinBox"><span class="coin" id="coinIcon"></span><span id="coinN">0</span></div>
      <div class="streak hidden" id="streak"></div>
      <button class="icon" id="btnSettings" aria-label="Settings" style="margin-left:auto"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="#7a604a" stroke-width="2.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="#7a604a" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </header>
    <div id="scene">
      <div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div><div class="path"></div>
      <div id="builds"></div>
      <div id="stall"><div id="basketN"></div></div>
      <div id="pipwrap" class="hidden"><div id="pipbub" class="hidden"></div></div>
    </div>
    <div class="vdock">
      <div class="sellrow">
        <button class="pill primary hidden" id="btnSell" style="flex:1"></button>
        <button class="pill hidden" id="btnSell2" style="flex:none"></button>
      </div>
      <div class="nextb hidden" id="nextB"><div style="flex:1;min-width:0"><div class="nm" id="nextNm"></div><div class="bar"><i id="nextFill"></i></div></div><button class="pill go" id="nextGo">Build</button></div>
      <button class="pill primary" id="btnPlay">Play</button>
    </div>
  </section>

  <canvas id="fx"></canvas>
  <div id="overlay"></div>
</div>

<script>/*__ENGINE__*/</script>
<script>/*__LEVELS__*/</script>
<script>
"use strict";
const E = Sow, LEVELS = self.LEVELS;
const Q = new URLSearchParams(location.search);
const FAST = Q.has('fast');            // shrink ad/time gates for testing
const DEBUG = Q.has('debug');
const AD_GATE_MS = FAST ? 20000 : 180000;
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================ SAVE ============================ */
const KEY = 'harvest-sow-proto-v1';
const defSave = () => ({ level: 0, stars: [], coins: 10, basket: 0, built: ['cottage'], helper: { hired: false, last: 0, boostUntil: 0 },
  ftue: {}, settings: { sound: true, haptics: true, reduce: matchMedia('(prefers-reduced-motion: reduce)').matches }, daily: { last: '', streak: 0 }, sessions: 0, firstOpen: Date.now(), log: [] });
let save;
try { save = Object.assign(defSave(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { save = defSave(); }
if (Q.has('reset')) { save = defSave(); }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
save.sessions++; persist();

/* ============================ ANALYTICS (local; same event names we will send to a real SDK) ============================ */
const T0 = performance.now();
const sinceOpen = () => Math.round(performance.now() - T0);
const marks = {};
function track(name, props) {
  const row = { t: sinceOpen(), n: name, p: props || {} };
  if (!(name in marks)) marks[name] = row.t;
  save.log.push(row); if (save.log.length > 400) save.log.shift(); persist();
  if (DEBUG) console.log('[evt]', row.t, name, JSON.stringify(row.p));
}
track('app_open', { session: save.sessions });

/* ============================ AUDIO + HAPTICS ============================ */
const Audio_ = {
  ctx: null,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (self.AudioContext || self.webkitAudioContext)(); } catch (e) {} },
  tone(f, d, type = 'sine', v = 0.16, slideTo, delay = 0) {
    if (!save.settings.sound || !this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },

$('#btnSettings').onclick = () => {
  const row = (k, l) => `<div class="set"><span>${l}</span><div class="tog ${save.settings[k] ? 'on' : ''}" data-k="${k}"></div></div>`;
  const marksTxt = ['first_tap', 'level_win', 'harvest', 'sale', 'helper_hired', 'rewarded_offer', 'interstitial_show'].map((k) => k + ': ' + (marks[k] !== undefined ? (marks[k] / 1000).toFixed(1) + 's' : '—')).join('\n');
  const v = veil(`<div class="card" style="text-align:left"><h2 style="text-align:center">Settings</h2>${row('sound', 'Sound')}${row('haptics', 'Haptics (phones that support it)')}${row('reduce', 'Reduce motion')}
    <div style="margin-top:10px;font-weight:800">First-session timeline</div><pre class="log">${marksTxt}</pre>
    ${DEBUG ? '<div class="btns" style="margin-top:8px"><button class="pill ghost" id="dCoins">+100 coins</button><button class="pill ghost" id="dTime">Pip +2h</button><button class="pill ghost" id="dLog">Copy event log</button><button class="pill ghost" id="dReset">Reset save</button></div>' : ''}
    <div class="btns" style="margin-top:12px"><button class="pill primary" id="sClose">Done</button></div></div>`);
  v.querySelectorAll('.tog').forEach((t) => t.onclick = () => { const k = t.dataset.k; save.settings[k] = !save.settings[k]; t.classList.toggle('on', save.settings[k]); persist(); sfx.ui(); });
  $('#sClose').onclick = () => v.remove();
  if (DEBUG) { $('#dCoins').onclick = () => { save.coins += 100; persist(); renderCoins(); renderBuilds(); }; $('#dTime').onclick = () => { save.helper.last -= 2 * 3600000; persist(); updatePipBubble(); };
    $('#dLog').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(save.log)); toast('Copied'); }; $('#dReset').onclick = () => { localStorage.removeItem(KEY); location.search = '?debug'; }; }
};
if (DEBUG) { self.H = { save: () => save, go: (i) => startLevel(i), win: () => { st.s[6] = lv.goal; st.status = 'won'; onWin(); }, valley: () => openValley({}), E, LEVELS }; }

/* ============================ BOOT ============================ */
if (save.level === 0 && !save.ftue.sold) { startLevel(0); }   // first move inside seconds: straight into the field, no menu, no splash
else { cur = Math.min(save.level, LEVELS.length - 1); if (save.ftue.helper) openValley({}); else openValley({ ceremony: save.basket ? 'sale' : undefined }); }
</script>
</body>
</html>
